<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    .slider {
      display: flex;
      gap: 16px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 40px 20px;

      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .item {
      flex: 0 0 220px;
    }

    .video {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #111;
    }

    .score {
      width: 100%;
      height: 40px;
      margin-top: 10px;
    }
