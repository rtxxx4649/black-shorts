<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TREND HUB</title><style>*{box-sizing:border-box}html{overflow-anchor:none}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.header{padding:0 20px 500px;background:linear-gradient(90deg,#0004,#0001,#0004),url('./e2e1003b-f8c4-4441-924c-df430cc634a5.png') center/cover;text-align:left}.site-title{font-size:clamp(22.5px,2.5vw,30px);font-weight:700;text-align:left}.e{color:red}.site-subtitle{color:#aaa;font-size:clamp(9px,1vw,11px);margin-top:8px;text-align:left}.twitch-section{background:#000;padding:0;margin:0;position:relative;z-index:2;clear:both;display:flow-root}.twitch-player{width:100%;max-width:none;margin:0;background:#111;border:1px solid #333;display:grid;grid-template-columns:2fr 1fr;height:56.25vw;aspect-ratio:auto}.twitch-player.twitch-player-floating{position:fixed;top:0;left:0;width:100vw;max-width:100vw;height:56.25vw;margin:0;z-index:1000;aspect-ratio:auto}.twitch-video-frame,.twitch-chat-frame{width:100%;height:100%;border:0;background:#111}.twitch-loading,.twitch-error{height:100%;min-height:240px;display:flex;align-items:center;justify-content:center;color:#bbb;text-align:center;padding:20px}.twitch-switch-controls,.youtube-switch-controls{display:flex;gap:0;margin:0;width:min(100%,1000px);position:relative;z-index:3}.twitch-switch-controls button,.youtube-switch-controls button{min-width:145px;flex:1}.twitch-switch-controls button:first-child,.youtube-switch-controls button:first-child{border-radius:10px 0 0 10px}.twitch-switch-controls button:last-child,.youtube-switch-controls button:last-child{border-radius:0 10px 10px 0}.twitch-switch-controls button+button,.youtube-switch-controls button+button{border-left:0}button{border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:17px;font-weight:700;min-width:145px;height:46px;cursor:pointer}button:disabled{opacity:.5}.youtube-section{background:#000;padding:0;margin:0;position:relative;z-index:1;clear:both;display:flex;flex-direction:column}.youtube-video-title{width:100%;padding:clamp(8px,1vw,14px) clamp(12px,2vw,24px) 0;background:#000;color:#fff;font-size:clamp(14px,1.5vw,22px);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:2}.youtube-video-meta{display:flex;align-items:center;gap:10px;background:#000;color:#fff;padding:clamp(6px,.8vw,10px) clamp(12px,2vw,24px) clamp(10px,1vw,16px);margin:0 auto;width:100%;position:relative;z-index:2;flex:none;overflow:hidden;order:3}.youtube-video-avatar{width:clamp(28px,3vw,44px);height:clamp(28px,3vw,44px);border-radius:50%;object-fit:cover;flex:none;background:#222}.youtube-video-info{min-width:0;display:flex;flex-direction:row;align-items:center;gap:clamp(8px,1vw,14px);overflow:hidden;flex:1}.youtube-video-channel{font-size:clamp(13px,1.4vw,20px);font-weight:700;min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.youtube-video-stats{font-size:clamp(12px,1.2vw,18px);color:#bbb;flex:none;white-space:nowrap}.country-name{background:#000;text-align:center;padding:18px}.country-location{font-size:30px;font-weight:600}.slider{display:flex;gap:24px;overflow-x:auto;padding:0 20px}.item{flex:0 0 300px;background:#000;padding:10px}.thumbnail{aspect-ratio:16/9;background:#111}.thumbnail img{width:100%;height:100%;object-fit:cover}.video-title{margin-top:10px;height:63px;overflow:hidden}.score{display:grid;grid-template-columns:1fr 1fr;font-size:14px;margin-top:10px}#twitchStreamTitle,#twitchStreamMeta{display:none!important}#twitchStreamTitleBottom{display:block!important;visibility:visible!important}#twitchStreamMetaBottom{display:flex!important;visibility:visible!important}.twitch-stream-title#twitchStreamTitleBottom{display:block;width:100%;padding:clamp(8px,1vw,14px) clamp(12px,2vw,24px) 0;margin:0;background:#000;color:#fff;font-size:clamp(14px,1.5vw,22px);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.twitch-stream-meta#twitchStreamMetaBottom{display:flex;width:100%;margin:0;align-items:center;gap:clamp(8px,1vw,14px);padding:clamp(6px,.8vw,10px) clamp(12px,2vw,24px) clamp(10px,1vw,16px);background:#000;color:#fff;overflow:hidden}.twitch-stream-meta#twitchStreamMetaBottom .twitch-stream-avatar{width:clamp(28px,3vw,44px);height:clamp(28px,3vw,44px)}.twitch-stream-meta#twitchStreamMetaBottom .twitch-stream-name{font-size:clamp(13px,1.4vw,20px);font-weight:700;min-width:0;flex:1}.twitch-stream-meta#twitchStreamMetaBottom .twitch-stream-viewers{font-size:clamp(12px,1.2vw,18px);color:#bbb;white-space:nowrap;flex:none}.twitch-stream-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}.twitch-stream-name{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.twitch-stream-viewers{font-size:12px;color:#bbb;white-space:nowrap}.page-controls{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;background:#000;padding:8px 0 16px}.page-controls .twitch-switch-controls,.page-controls .youtube-switch-controls{width:min(90vw,1200px)}.page-controls .twitch-switch-controls{order:1}.page-controls .youtube-switch-controls{order:2}.page-controls #twitchMuteButton,.page-controls #youtubeMuteButton{display:none!important}.page-controls .twitch-switch-controls #twitchNextButton,.page-controls .youtube-switch-controls #youtubeNextButton{border-radius:10px}.audio-switch-button{width:min(90vw,1200px);height:46px;min-width:145px;border-radius:10px!important}.page-controls .audio-switch-button{order:3}.page-controls .youtube-switch-controls{order:2}@media(max-width:700px){.header{padding-bottom:120px;margin-bottom:0;text-align:left}.site-title,.site-subtitle{text-align:left;margin-left:0}.twitch-section{padding-bottom:0}.youtube-section{padding-top:0}.youtube-video-meta{padding:10px 12px 8px}.youtube-video-avatar{width:36px;height:36px}.youtube-video-channel{font-size:14px}.youtube-video-stats{font-size:12px}.twitch-player{display:grid;grid-template-columns:1fr;overflow:hidden;aspect-ratio:auto;width:100%;height:56.25vw}.twitch-video-frame{width:100%;height:100%}.twitch-chat-frame{display:none}.item{flex-basis:270px}.country-location{font-size:25px}.youtube-player{width:100%;height:56.25vw}.page-controls{gap:8px;padding:8px 0 12px}.audio-switch-button{height:46px;width:min(90vw,1200px)}}@media(max-width:700px) and (orientation:landscape){.twitch-player{aspect-ratio:auto;width:100%;height:56.25vw}.twitch-video-frame{width:100%;height:100%}.youtube-player{width:100%;height:56.25vw}}@media(min-width:701px){.header{padding-bottom:442px}.site-title,.site-subtitle{transform:translateY(2cm)}.site-title{font-size:clamp(90px,10vw,120px)}.site-subtitle{font-size:clamp(36px,4vw,44px)}.twitch-player{width:100%;aspect-ratio:auto;height:56.25vw}.youtube-player{width:100%;height:56.25vw}.page-controls .twitch-switch-controls,.page-controls .youtube-switch-controls{width:100%}.page-controls button{min-width:0;height:clamp(92px,8vw,128px);font-size:clamp(17px,1.5vw,22px)}.audio-switch-button{height:clamp(92px,8vw,128px);font-size:clamp(17px,1.5vw,22px);width:100%}.page-controls{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:0;align-items:stretch;padding:8px 0 16px}.page-controls .twitch-switch-controls{grid-column:1;grid-row:1}.page-controls .youtube-switch-controls{grid-column:2;grid-row:1}.page-controls .audio-switch-button{grid-column:1 / -1;grid-row:2}.page-controls .twitch-switch-controls,.page-controls .youtube-switch-controls{width:100%}}.youtube-player{position:relative;z-index:1;flex:none;order:1}.youtube-player iframe{display:block;width:100%;height:100%;border:0}.youtube-player>#youtubePlayerMount{position:relative;width:100%;height:100%;min-width:0;min-height:0}.youtube-player>#youtubePlayerMount iframe{display:block;width:100%!important;height:100%!important;border:0}</style></head><body><header class="header"><div class="site-title">TR<span class="e">E</span>ND HUB</div><div class="site-subtitle">DISCOVER WHAT'S TRENDING</div></header><section class="twitch-section" id="twitch"><div class="twitch-stream-title" id="twitchStreamTitle"></div><div class="twitch-stream-meta" id="twitchStreamMeta"><img class="twitch-stream-avatar" id="twitchStreamAvatar" alt=""><span class="twitch-stream-name" id="twitchStreamName"></span><span class="twitch-stream-viewers" id="twitchStreamViewers"></span></div><div class="twitch-player" id="twitchPlayerArea"><div class="twitch-loading">Twitch LIVEを読み込み中…</div></div><div class="twitch-stream-title" id="twitchStreamTitleBottom"></div><div class="twitch-stream-meta" id="twitchStreamMetaBottom"><img class="twitch-stream-avatar" id="twitchStreamAvatarBottom" alt=""><span class="twitch-stream-name" id="twitchStreamNameBottom"></span><span class="twitch-stream-viewers" id="twitchStreamViewersBottom"></span></div></section><section class="youtube-section" id="youtube"><div class="youtube-player" id="youtubePlayerArea"><div id="youtubePlayerMount"><div class="twitch-loading">YouTube動画を読み込み中…</div></div></div><div class="youtube-video-title" id="youtubeVideoTitle"></div><div class="youtube-video-meta"><img class="youtube-video-avatar" id="youtubeVideoAvatar" alt=""><div class="youtube-video-info"><div class="youtube-video-channel" id="youtubeVideoChannel"></div><div class="youtube-video-stats" id="youtubeVideoStats"></div></div></div></section><div class="page-controls"><div class="twitch-switch-controls"><button id="twitchMuteButton">Mute</button><button id="twitchNextButton">Next Stream</button></div><button id="audioSwitchButton" class="audio-switch-button">Twitch audio</button><div class="youtube-switch-controls"><button id="youtubeMuteButton">Unmute</button><button id="youtubeNextButton">Next Video</button></div></div><script src="https://www.youtube.com/iframe_api"></script><script src="https://player.twitch.tv/js/embed/v1.js"></script><script>const countries=[['🇺🇸','UNITED STATES','US'],['🇬🇧','UNITED KINGDOM','GB'],['🇦🇺','AUSTRALIA','AU'],['🇨🇦','CANADA','CA'],['🇩🇪','GERMANY','DE'],['🇵🇭','PHILIPPINES','PH'],['🇪🇸','SPAIN','ES'],['🇫🇷','FRANCE','FR'],['🇰🇷','SOUTH KOREA','KR'],['🇮🇹','ITALY','IT'],['🇻🇳','VIETNAM','VN'],['🇹🇷','TURKEY','TR'],['🇮🇳','INDIA','IN'],['🇧🇷','BRAZIL','BR'],['🇮🇩','INDONESIA','ID'],['🇯🇵','JAPAN','JP'],['🇲🇽','MEXICO','MX'],['🇹🇭','THAILAND','TH']].map(x=>({flag:x[0],name:x[1],regionCode:x[2]}));let youtubeVideos=[],youtubeUsedIds=new Set(),youtubePlayer=null,youtubeReady=false,currentYouTubeVideo=null,youtubeMuted=true;let audioMode='twitch';function setYouTubeVideoMeta(video){const title=document.getElementById('youtubeVideoTitle');const avatar=document.getElementById('youtubeVideoAvatar');const channel=document.getElementById('youtubeVideoChannel');const stats=document.getElementById('youtubeVideoStats');if(!video){title.textContent='';avatar.removeAttribute('src');channel.textContent='';stats.textContent='';return}title.textContent=video.title||'';avatar.src=video.channel_avatar||'';channel.textContent=video.channel_title||'';const likes=Number(video.likes||0).toLocaleString('en-US');const comments=Number(video.comments||0).toLocaleString('en-US');stats.textContent=likes+' likes · '+comments+' comments'}function applyAudioMode(){const button=document.getElementById('audioSwitchButton');if(audioMode==='twitch'){button.textContent='Twitch audio';if(player)try{player.setMuted(false)}catch(e){}if(youtubePlayer)try{youtubePlayer.mute();youtubeMuted=true}catch(e){}}else{button.textContent='YouTube audio';if(player)try{player.setMuted(true)}catch(e){}if(youtubePlayer)try{youtubePlayer.unMute();youtubeMuted=false}catch(e){}}}async function loadYouTubeVideos(){const results=await Promise.all(countries.map(async c=>{try{const r=await fetch('/api/videos?regionCode='+c.regionCode);if(!r.ok)throw Error(r.status);const d=await r.json();return Array.isArray(d.videos)?d.videos.slice(0,50):[]}catch(e){console.error(e);return []}}));youtubeVideos=results.flat().filter(v=>v&&v.video_id);if(youtubeReady&&!currentYouTubeVideo)playRandomYouTubeVideo()}function getNextYouTubeVideo(){if(!youtubeVideos.length)return null;if(youtubeUsedIds.size>=youtubeVideos.length)youtubeUsedIds.clear();const available=youtubeVideos.filter(v=>!youtubeUsedIds.has(v.video_id));if(!available.length){youtubeUsedIds.clear();return youtubeVideos[Math.floor(Math.random()*youtubeVideos.length)]}const selected=available[Math.floor(Math.random()*available.length)];youtubeUsedIds.add(selected.video_id);return selected}function playRandomYouTubeVideo(){const video=getNextYouTubeVideo();if(!video||!youtubePlayer)return;currentYouTubeVideo=video;setYouTubeVideoMeta(video);youtubePlayer.loadVideoById(video.video_id);if(audioMode==='twitch'){youtubePlayer.mute();youtubeMuted=true}else{youtubePlayer.unMute();youtubeMuted=false}youtubePlayer.playVideo()}function onYouTubeIframeAPIReady(){youtubePlayer=new YT.Player('youtubePlayerMount',{videoId:'',playerVars:{autoplay:1,mute:1,rel:0,playsinline:1},events:{onReady:function(){youtubeReady=true;if(youtubeVideos.length){const video=getNextYouTubeVideo();if(video){currentYouTubeVideo=video;setYouTubeVideoMeta(video);youtubePlayer.loadVideoById({videoId:video.video_id,startSeconds:0,suggestedQuality:'default'});youtubePlayer.playVideo();applyAudioMode()}}},onStateChange:function(event){if(event.data===YT.PlayerState.ENDED)playRandomYouTubeVideo()}}})}document.getElementById('audioSwitchButton').onclick=()=>{audioMode=audioMode==='twitch'?'youtube':'twitch';applyAudioMode()};document.getElementById('youtubeNextButton').onclick=()=>{playRandomYouTubeVideo()};loadYouTubeVideos();let player=null,login='',busy=false;const seenTwitchStreamers=new Set();const twitchMuteButton=document.getElementById('twitchMuteButton');function setTwitchMuteButton(){if(!player)return;try{const muted=player.getMuted();twitchMuteButton.textContent=muted?'Unmute':'Mute'}catch(e){twitchMuteButton.textContent='Mute'}}function createPlayer(name,autoplay){const a=document.getElementById('twitchPlayerArea');a.innerHTML='';const v=document.createElement('div');v.className='twitch-video-frame';a.appendChild(v);const chat=document.createElement('iframe');chat.className='twitch-chat-frame';chat.src='https://www.twitch.tv/embed/'+encodeURIComponent(name)+'/chat?parent='+encodeURIComponent(location.hostname)+'&darkpopout';chat.allow='autoplay;fullscreen';a.appendChild(chat);if(!window.Twitch||!Twitch.Player)throw Error('Twitch Player API unavailable');player=new Twitch.Player(v,{channel:name,width:'100%',height:'100%',autoplay:true,muted:audioMode!=='twitch',parent:[location.hostname]});setTwitchMuteButton();player.addEventListener(Twitch.Player.PLAY,()=>{try{player.setMuted(audioMode!=='twitch')}catch(e){}setTwitchMuteButton()});player.addEventListener(Twitch.Player.PLAYING,()=>{try{player.setMuted(audioMode!=='twitch')}catch(e){}setTwitchMuteButton()});player.addEventListener(Twitch.Player.READY,()=>{try{player.setMuted(audioMode!=='twitch');player.play()}catch(e){}setTwitchMuteButton()})}async function loadTwitch(autoplay=false){try{const seen=[...seenTwitchStreamers].join(',');const url=seen?'/api/twitch?seen='+encodeURIComponent(seen):'/api/twitch';const r=await fetch(url);if(!r.ok)throw Error(r.status);const d=await r.json();const streams=Array.isArray(d.streams)?d.streams:[];if(!streams.length){document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-error">現在表示できる未視聴のTwitch LIVEがありません。</div>';player=null;return}const selected=streams[Math.floor(Math.random()*streams.length)];login=selected.user_login;document.getElementById('twitchStreamTitle').textContent=selected.title||'';document.getElementById('twitchStreamAvatar').src=selected.profile_image_url||'';document.getElementById('twitchStreamName').textContent=selected.user_name||selected.user_login||'';document.getElementById('twitchStreamViewers').textContent=Number(selected.viewer_count||0).toLocaleString('en-US')+' viewers';document.getElementById('twitchStreamTitleBottom').textContent=selected.title||'';document.getElementById('twitchStreamAvatarBottom').src=selected.profile_image_url||'';document.getElementById('twitchStreamNameBottom').textContent=selected.user_name||selected.user_login||'';document.getElementById('twitchStreamViewersBottom').textContent=Number(selected.viewer_count||0).toLocaleString('en-US')+' viewers';seenTwitchStreamers.add(login.toLowerCase());createPlayer(login,autoplay)}catch(e){console.error(e);document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-error">Twitch LIVEの読み込みに失敗しました。</div>';player=null}}twitchMuteButton.onclick=()=>{if(!player)return;try{const muted=player.getMuted();player.setMuted(!muted);setTwitchMuteButton()}catch(e){console.error(e)}};document.getElementById('twitchNextButton').onclick=async()=>{if(busy)return;busy=true;const b=document.getElementById('twitchNextButton');b.disabled=true;document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-loading">次のTwitch LIVEを読み込み中…</div>';try{await loadTwitch(true);applyAudioMode()}finally{busy=false;b.disabled=false}};loadTwitch(false);</script></body></html>
