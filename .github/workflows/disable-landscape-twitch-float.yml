name: Disable Twitch floating player on landscape mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update landscape behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "function updateTwitchFloating(){if(twitchFloatClosed)return;const playerRect=twitchArea.getBoundingClientRect();"
          new = "function updateTwitchFloating(){const landscapeMobile=window.matchMedia('(max-width:700px) and (orientation:landscape)').matches;if(landscapeMobile){if(twitchFloating){twitchArea.classList.remove('is-floating');twitchPlaceholder.style.display='none';floatClose.style.display='none';twitchFloating=false}return}if(twitchFloatClosed)return;const playerRect=twitchArea.getBoundingClientRect();"
          if old not in s:
              raise SystemExit('target code not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove this temporary workflow
        run: rm -f .github/workflows/disable-landscape-twitch-float.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/disable-landscape-twitch-float.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Disable Twitch mini player on mobile landscape'
          git push