name: Direct Twitch metadata update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Twitch metadata CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index2.html')
          s=p.read_text()
          old='.twitch-stream-title,.twitch-stream-meta,#twitchStreamTitleBottom,#twitchStreamMetaBottom{display:none!important}'
          new='#twitchStreamTitle,#twitchStreamMeta{display:none!important}.twitch-stream-title#twitchStreamTitleBottom{display:block;width:100%;padding:clamp(8px,1vw,14px) clamp(12px,2vw,24px) 0;background:#000;color:#fff;font-size:clamp(14px,1.5vw,22px);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.twitch-stream-meta#twitchStreamMetaBottom{display:flex;width:100%;align-items:center;gap:clamp(8px,1vw,14px);padding:clamp(6px,.8vw,10px) clamp(12px,2vw,24px) clamp(10px,1vw,16px);background:#000;color:#fff;overflow:hidden}.twitch-stream-meta#twitchStreamMetaBottom .twitch-stream-avatar{width:clamp(28px,3vw,44px);height:clamp(28px,3vw,44px)}.twitch-stream-meta#twitchStreamMetaBottom .twitch-stream-name{font-size:clamp(13px,1.4vw,20px);font-weight:700;min-width:0;flex:1}.twitch-stream-meta#twitchStreamMetaBottom .twitch-stream-viewers{font-size:clamp(12px,1.2vw,18px);color:#bbb;white-space:nowrap;flex:none}'
          if old not in s:
              raise SystemExit('expected CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index2.html
          git commit -m 'feat: show Twitch stream metadata between players'
          git push
