<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twitch + YouTube Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.player{width:100%;height:56.25vw;background:#111;overflow:hidden}
.twitch-player{display:grid;grid-template-columns:2fr 1fr}
.twitch-video-frame,.twitch-chat-frame{width:100%;height:100%;border:0;background:#111}
.youtube-player{position:relative}
.youtube-player iframe{display:block;width:100%;height:100%;border:0}
.youtube-player-mount{width:100%;height:100%}
.info{background:#000;padding:10px 14px;display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#222;flex:none}
.info-text{min-width:0;flex:1}
.title{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#000}
.controls button{width:100%;height:52px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.controls button:disabled{opacity:.5;cursor:default}
.controls .audio{grid-column:1/-1}
.loading,.error{height:100%;min-height:240px;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center;padding:20px}
@media(max-width:700px){
 .twitch-player{display:block;height:56.25vw}
 .twitch-chat-frame{display:none}
 .player{height:56.25vw}
 .info{padding:8px 12px}
 .title{font-size:15px}
 .meta{font-size:12px}
 .controls{grid-template-columns:1fr 1fr}
 .controls button{height:46px;font-size:15px}
}
</style>
</head>
<body>
<section id="twitchSection">
 <div id="twitchPlayerArea" class="player twitch-player"><div class="loading">Twitch LIVEを読み込み中…</div></div>
 <div class="info">
  <img id="twitchAvatar" class="avatar" alt="">
  <div class="info-text"><div id="twitchTitle" class="title"></div><div id="twitchMeta" class="meta"></div></div>
 </div>
</section>
<section id="youtubeSection">
 <div id="youtubePlayerArea" class="player youtube-player"><div id="youtubePlayerMount" class="youtube-player-mount"><div class="loading">YouTube動画を読み込み中…</div></div></div>
 <div class="info">
  <img id="youtubeAvatar" class="avatar" alt="">
  <div class="info-text"><div id="youtubeTitle" class="title"></div><div id="youtubeMeta" class="meta"></div></div>
 </div>
</section>
<div class="controls">
 <button id="twitchMuteButton">Mute</button>
 <button id="twitchNextButton">Next Stream</button>
 <button id="audioSwitchButton" class="audio">Twitch audio</button>
 <button id="youtubeMuteButton">Mute</button>
 <button id="youtubeNextButton">Next Video</button>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
const countries=['US','GB','AU','CA','DE','PH','ES','FR','KR','IT','VN','TR','IN','BR','ID','JP','MX','TH'];
let youtubeVideos=[],youtubeUsedIds=new Set(),youtubePlayer=null,youtubeReady=false,currentYouTubeVideo=null,youtubeMuted=true;
let player=null,login='',busy=false,audioMode='twitch';
const seenTwitchStreamers=new Set();
const twitchMuteButton=document.getElementById('twitchMuteButton');
const youtubeMuteButton=document.getElementById('youtubeMuteButton');

function setYouTubeMeta(video){
 const avatar=document.getElementById('youtubeAvatar');
 if(!video){document.getElementById('youtubeTitle').textContent='';document.getElementById('youtubeMeta').textContent='';avatar.removeAttribute('src');return}
 document.getElementById('youtubeTitle').textContent=video.title||'';
 avatar.src=video.channel_avatar||'';
 document.getElementById('youtubeMeta').textContent=(video.channel_title||'')+' · '+Number(video.views||0).toLocaleString('en-US')+' views';
}
function setTwitchMeta(stream){
 document.getElementById('twitchTitle').textContent=stream?.title||'';
 document.getElementById('twitchAvatar').src=stream?.profile_image_url||'';
 document.getElementById('twitchMeta').textContent=stream?((stream.user_name||stream.user_login||'')+' · '+Number(stream.viewer_count||0).toLocaleString('en-US')+' viewers'):'';
}
function applyAudioMode(){
 const button=document.getElementById('audioSwitchButton');
 if(audioMode==='twitch'){
  button.textContent='Twitch audio';
  if(player)try{player.setMuted(false);twitchMuteButton.textContent='Mute'}catch(e){}
  if(youtubePlayer)try{youtubePlayer.mute();youtubeMuted=true;youtubeMuteButton.textContent='Unmute'}catch(e){}
 }else{
  button.textContent='YouTube audio';
  if(player)try{player.setMuted(true);twitchMuteButton.textContent='Unmute'}catch(e){}
  if(youtubePlayer)try{youtubePlayer.unMute();youtubeMuted=false;youtubeMuteButton.textContent='Mute'}catch(e){}
 }
}
async function loadYouTubeVideos(){
 const results=await Promise.all(countries.map(async regionCode=>{
  try{const r=await fetch('/api/videos?regionCode='+regionCode);if(!r.ok)throw Error(r.status);const d=await r.json();return Array.isArray(d.videos)?d.videos.slice(0,50):[]}
  catch(e){console.error(e);return []}
 }));
 youtubeVideos=results.flat().filter(v=>v&&v.video_id);
 if(youtubeReady&&!currentYouTubeVideo)playRandomYouTubeVideo();
}
function getNextYouTubeVideo(){
 if(!youtubeVideos.length)return null;
 if(youtubeUsedIds.size>=youtubeVideos.length)youtubeUsedIds.clear();
 const available=youtubeVideos.filter(v=>!youtubeUsedIds.has(v.video_id));
 if(!available.length){youtubeUsedIds.clear();return youtubeVideos[Math.floor(Math.random()*youtubeVideos.length)]}
 const selected=available[Math.floor(Math.random()*available.length)];youtubeUsedIds.add(selected.video_id);return selected;
}
function playRandomYouTubeVideo(){
 const video=getNextYouTubeVideo();if(!video||!youtubePlayer)return;
 currentYouTubeVideo=video;setYouTubeMeta(video);youtubePlayer.loadVideoById(video.video_id);applyAudioMode();youtubePlayer.playVideo();
}
function onYouTubeIframeAPIReady(){
 youtubePlayer=new YT.Player('youtubePlayerMount',{videoId:'',playerVars:{autoplay:1,mute:1,rel:0,playsinline:1},events:{
  onReady:function(){youtubeReady=true;if(youtubeVideos.length)playRandomYouTubeVideo();},
  onStateChange:function(e){if(e.data===YT.PlayerState.ENDED)playRandomYouTubeVideo();}
 }});
}
function setTwitchMuteButton(){if(!player)return;try{twitchMuteButton.textContent=player.getMuted()?'Unmute':'Mute'}catch(e){}}
function createTwitchPlayer(name){
 const area=document.getElementById('twitchPlayerArea');area.innerHTML='';
 const video=document.createElement('div');video.className='twitch-video-frame';area.appendChild(video);
 const chat=document.createElement('iframe');chat.className='twitch-chat-frame';chat.src='https://www.twitch.tv/embed/'+encodeURIComponent(name)+'/chat?parent='+encodeURIComponent(location.hostname)+'&darkpopout';chat.allow='autoplay;fullscreen';area.appendChild(chat);
 if(!window.Twitch||!Twitch.Player)throw Error('Twitch Player API unavailable');
 player=new Twitch.Player(video,{channel:name,width:'100%',height:'100%',autoplay:true,muted:audioMode!=='twitch',parent:[location.hostname]});
 setTwitchMuteButton();
 player.addEventListener(Twitch.Player.PLAY,()=>{try{player.setMuted(audioMode!=='twitch')}catch(e){}setTwitchMuteButton()});
 player.addEventListener(Twitch.Player.PLAYING,()=>{try{player.setMuted(audioMode!=='twitch')}catch(e){}setTwitchMuteButton()});
 player.addEventListener(Twitch.Player.READY,()=>{try{player.setMuted(audioMode!=='twitch');player.play()}catch(e){}setTwitchMuteButton()});
}
async function loadTwitch(){
 try{
  const seen=[...seenTwitchStreamers].join(',');
  const r=await fetch(seen?'/api/twitch?seen='+encodeURIComponent(seen):'/api/twitch');
  if(!r.ok)throw Error(r.status);
  const d=await r.json();const streams=Array.isArray(d.streams)?d.streams:[];
  if(!streams.length){document.getElementById('twitchPlayerArea').innerHTML='<div class="error">現在表示できる未視聴のTwitch LIVEがありません。</div>';player=null;return}
  const selected=streams[Math.floor(Math.random()*streams.length)];login=selected.user_login;seenTwitchStreamers.add(login.toLowerCase());setTwitchMeta(selected);createTwitchPlayer(login);
 }catch(e){console.error(e);document.getElementById('twitchPlayerArea').innerHTML='<div class="error">Twitch LIVEの読み込みに失敗しました。</div>';player=null}
}
twitchMuteButton.onclick=()=>{if(!player)return;try{player.setMuted(!player.getMuted());setTwitchMuteButton()}catch(e){}};
youtubeMuteButton.onclick=()=>{if(!youtubePlayer)return;try{if(youtubeMuted){youtubePlayer.unMute();youtubeMuted=false;youtubeMuteButton.textContent='Mute'}else{youtubePlayer.mute();youtubeMuted=true;youtubeMuteButton.textContent='Unmute'}}catch(e){}};
document.getElementById('audioSwitchButton').onclick=()=>{audioMode=audioMode==='twitch'?'youtube':'twitch';applyAudioMode()};
document.getElementById('youtubeNextButton').onclick=()=>playRandomYouTubeVideo();
document.getElementById('twitchNextButton').onclick=async()=>{if(busy)return;busy=true;const b=document.getElementById('twitchNextButton');b.disabled=true;document.getElementById('twitchPlayerArea').innerHTML='<div class="loading">次のTwitch LIVEを読み込み中…</div>';try{await loadTwitch();applyAudioMode()}finally{busy=false;b.disabled=false}};
loadYouTubeVideos();
loadTwitch();
</script>
</body>
</html>
