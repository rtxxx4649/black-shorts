<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREND HUB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;background:#fff;font-family:Arial,sans-serif}
header{width:100%;padding:20px 24px}
header h1{margin:0;font-size:clamp(22.5px,2.5vw,30px);text-align:left}
header p{margin:4px 0 0;font-size:clamp(9px,1vw,11px);text-align:left}
.twitch-wrap{width:100%;margin:0;padding:0}
.twitch-player{position:relative;width:100%;aspect-ratio:16/9;margin:0;padding:0}
.twitch-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<header>
<h1>TREND HUB</h1>
<p>DISCOVER WHAT'S TRENDING</p>
</header>
<div class="twitch-wrap">
<div class="twitch-player">
<iframe id="twitch-player" allowfullscreen></iframe>
</div>
</div>
<script>
const player=document.getElementById('twitch-player');
fetch('/api/twitch').then(r=>r.json()).then(d=>{
const stream=d.stream;
if(stream&&stream.user_login){
const parent=location.hostname;
player.src=`https://player.twitch.tv/?channel=${encodeURIComponent(stream.user_login)}&parent=${encodeURIComponent(parent)}`;
}
}).catch(()=>{});
</script>
</body>
</html>
