<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>TREND SHORTS</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      padding: 40px 0;
      font-family: Arial, sans-serif;
    }

    /* Header */

    .header {
      padding: 0 20px;
      margin-bottom: 30px;
    }

    /* Site Title */

    .site-title {
      color: #fff;
      font-size: 48px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Site Subtitle */

    .site-subtitle {
      color: #aaa;
      font-size: 18px;
      margin-top: 6px;
      white-space: nowrap;
    }


    /* Advertisement Space */

    .ad-space {
      width: calc(100% - 40px);
      height: 120px;

      margin: 0 20px 60px;

      background: #111;
    }


    /* Country */

    .country {
      margin-bottom: 50px;
    }

    .country-name {
      color: #fff;
      font-size: 20px;
      padding: 0 20px;
      margin-bottom: 15px;
    }


    /* Horizontal Slider */

    .slider {
      display: flex;
      gap: 16px;

      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      padding: 0 20px;

      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }


    /* Video Card */

    .item {
      flex: 0 0 220px;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 9 / 16;

      background: #111;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #666;
    }


    /* Score */

    .score {
      width: 100%;
      height: 40px;

      margin-top: 10px;

      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style></head><body>  <!-- Header -->  <div class="header"><div class="site-title">
  TREND SHORTS
</div>

<div class="site-subtitle">
  DISCOVER WHAT'S TRENDING
</div>

  </div>  <!-- Advertisement Space -->  <div class="ad-space"></div>  <!-- Country Sliders -->  <script>

    const countries = [

      ["🇺🇸", "UNITED STATES"],
      ["🇬🇧", "UNITED KINGDOM"],
      ["🇦🇺", "AUSTRALIA"],
      ["🇨🇦", "CANADA"],

      ["🇩🇪", "GERMANY"],
      ["🇵🇭", "PHILIPPINES"],
      ["🇪🇸", "SPAIN"],
      ["🇫🇷", "FRANCE"],
      ["🇰🇷", "SOUTH KOREA"],
      ["🇮🇹", "ITALY"],
      ["🇻🇳", "VIETNAM"],
      ["🇹🇷", "TURKEY"],
      ["🇮🇳", "INDIA"],
      ["🇧🇷", "BRAZIL"],
      ["🇮🇩", "INDONESIA"],
      ["🇯🇵", "JAPAN"],
      ["🇲🇽", "MEXICO"],
      ["🇹🇭", "THAILAND"]

    ];


    const body = document.body;


    countries.forEach(([flag, name]) => {

      const section = document.createElement("section");

      section.className = "country";


      const title = document.createElement("div");

      title.className = "country-name";

      title.textContent = `${flag} ${name}`;


      const slider = document.createElement("div");

      slider.className = "slider";


      for (let i = 0; i < 50; i++) {

        const item = document.createElement("div");

        item.className = "item";


        item.innerHTML = `

          <div class="thumbnail">
            THUMBNAIL
          </div>

          <div class="score">
            SCORE
          </div>

        `;


        slider.appendChild(item);

      }


      section.appendChild(title);

      section.appendChild(slider);

      body.appendChild(section);

    });

  </script></body>
</html>
