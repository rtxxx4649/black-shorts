name: Change trending title

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  change-title:
    if: ${{ !contains(github.event.head_commit.message, 'Change trending title to TRENDING VIDEOS') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change title and remove helper workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '👑 TOP 50 TRENDING VIDEOS 🔥'
          new = '👑 TRENDING VIDEOS 🔥'
          if old not in s:
              raise SystemExit('Target title not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/change-trending-title.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/change-trending-title.yml
          git commit -m 'Change trending title to TRENDING VIDEOS'
          git push
