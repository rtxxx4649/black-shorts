<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title></title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      padding: 40px 0;
    }

    .country {
      margin-bottom: 50px;
    }

    .country-name {
      color: #fff;
      font-size: 20px;
      padding: 0 20px;
      margin-bottom: 15px;
    }

    .slider {
      display: flex;
      gap: 16px;

      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      padding: 0 20px;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .item {
      flex: 0 0 220px;
    }

    .video {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #111;
    }

    .score {
      width: 100%;
      height: 40px;
      margin-top: 10px;

      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style></head><body>  <script>

    const countries = [

      ["🇺🇸", "アメリカ"],
      ["🇬🇧", "イギリス"],
      ["🇦🇺", "オーストラリア"],
      ["🇨🇦", "カナダ"],

      ["🇩🇪", "ドイツ"],
      ["🇵🇭", "フィリピン"],
      ["🇪🇸", "スペイン"],
      ["🇫🇷", "フランス"],
      ["🇰🇷", "韓国"],
      ["🇮🇹", "イタリア"],
      ["🇻🇳", "ベトナム"],
      ["🇹🇷", "トルコ"],
      ["🇮🇳", "インド"],
      ["🇧🇷", "ブラジル"],
      ["🇮🇩", "インドネシア"],
      ["🇯🇵", "日本"],
      ["🇲🇽", "メキシコ"],
      ["🇹🇭", "タイ"]

    ];


    const body = document.body;


    countries.forEach(([flag, name]) => {

      const section = document.createElement("section");

      section.className = "country";


      const title = document.createElement("div");

      title.className = "country-name";

      title.textContent = `${flag} ${name}`;


      const slider = document.createElement("div");

      slider.className = "slider";


      for (let i = 0; i < 15; i++) {

        const item = document.createElement("div");

        item.className = "item";


        item.innerHTML = `

          <div class="video"></div>

          <div class="score">
            スコア
          </div>

        `;


        slider.appendChild(item);

      }


      section.appendChild(title);

      section.appendChild(slider);

      body.appendChild(section);

    });

  </script></body>
</html>
