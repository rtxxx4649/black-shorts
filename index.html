<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TREND HUB</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      padding: 40px 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .header {
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .site-title {
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .site-title .trend {
      color: #fff;
    }

    .site-title .world {
      color: #ff0000;
    }

    .site-title .e {
      color: #ff0000;
    }

    .site-title .hub {
      color: #FFA31A;
    }

    .site-subtitle {
      color: #aaa;
      font-size: 18px;
      margin-top: 8px;
      white-space: nowrap;
    }

    .ad-space {
      width: calc(100% - 40px);
      height: 120px;
      margin: 0 20px 60px;
      background: #111;
    }

    .country {
      margin-bottom: 55px;
    }

    .country-name {
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      padding: 18px 20px;
      margin-bottom: 18px;
      text-align: center;
      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
    }

    .country-flag {
      font-size: 38px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .country-title {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2;
    }

    .top-50 {
      color: #ff0000;
    }

    .slider {
      display: flex;
      gap: 24px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 20px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .item {
      flex: 0 0 300px;
      width: 300px;
      cursor: pointer;
    }

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      border-radius: 2px;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .video-title {
      width: 100%;
      margin-top: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      height: 63px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      word-break: break-word;
    }

    .video-category {
      display: none;
    }

    .score {
      width: 100%;
      margin-top: 10px;
      color: #fff;
      font-size: 13px;
      line-height: 1.6;
      font-weight: 500;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: repeat(3, auto);
      column-gap: 12px;
      row-gap: 2px;
      align-items: center;
    }

    .score-item {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-item:nth-child(1) {
      grid-column: 1;
      grid-row: 1;
    }

    .score-item:nth-child(2) {
      grid-column: 2;
      grid-row: 1;
    }

    .score-item:nth-child(3) {
      grid-column: 1;
      grid-row: 2;
    }

    .score-item:nth-child(4) {
      grid-column: 2;
      grid-row: 2;
    }

    .score-item:nth-child(5) {
      grid-column: 1;
      grid-row: 3;
    }

    .score-item:nth-child(6) {
      grid-column: 2;
      grid-row: 3;
    }

    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.95);
    }

    .player-overlay.active {
      display: flex;
    }

    .player-container {
      position: relative;
      width: min(1000px, 94vw);
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .close-player {
      position: absolute;
      top: -45px;
      right: 0;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 22px;
      line-height: 36px;
      cursor: pointer;
    }

    @media (max-width: 600px) {

      body {
        padding-top: 25px;
      }

      .site-title {
        font-size: 36px;
      }

      .site-subtitle {
        font-size: 15px;
      }

      .country {
        margin-bottom: 45px;
      }

      .country-name {
        font-size: 24px;
      }

      .country-flag {
        font-size: 34px;
      }

      .country-title {
        font-size: 24px;
      }

      .item {
        flex-basis: 270px;
        width: 270px;
      }

      .video-title {
        font-size: 14px;
        height: 58.8px;
      }

      .score {
        column-gap: 8px;
        font-size: 12px;
      }

    }

  </style>

</head>

<body>

  <header class="header">

    <div class="site-title">
      <span class="trend">TR</span><span class="e">E</span><span class="trend">ND</span>
      <span class="hub">HUB</span>
    </div>

    <div class="site-subtitle">
      DISCOVER WHAT'S TRENDING
    </div>

  </header>

  <div class="ad-space"></div>

  <main id="countries"></main>

  <div
    id="playerOverlay"
    class="player-overlay"
  >

    <div class="player-container">

      <button
        id="closePlayer"
        class="close-player"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

      <iframe
        id="youtubePlayer"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

    </div>

  </div>

  <script>

    const countries = [
      { flag: "🇺🇸", name: "UNITED STATES", regionCode: "US" },
      { flag: "🇬🇧", name: "UNITED KINGDOM", regionCode: "GB" },
      { flag: "🇦🇺", name: "AUSTRALIA", regionCode: "AU" },
      { flag: "🇨🇦", name: "CANADA", regionCode: "CA" },
      { flag: "🇩🇪", name: "GERMANY", regionCode: "DE" },
      { flag: "🇵🇭", name: "PHILIPPINES", regionCode: "PH" },
      { flag: "🇪🇸", name: "SPAIN", regionCode: "ES" },
      { flag: "🇫🇷", name: "FRANCE", regionCode: "FR" },
      { flag: "🇰🇷", name: "SOUTH KOREA", regionCode: "KR" },
      { flag: "🇮🇹", name: "ITALY", regionCode: "IT" },
      { flag: "🇻🇳", name: "VIETNAM", regionCode: "VN" },
      { flag: "🇹🇷", name: "TURKEY", regionCode: "TR" },
      { flag: "🇮🇳", name: "INDIA", regionCode: "IN" },
      { flag: "🇧🇷", name: "BRAZIL", regionCode: "BR" },
      { flag: "🇮🇩", name: "INDONESIA", regionCode: "ID" },
      { flag: "🇯🇵", name: "JAPAN", regionCode: "JP" },
      { flag: "🇲🇽", name: "MEXICO", regionCode: "MX" },
      { flag: "🇹🇭", name: "THAILAND", regionCode: "TH" }
    ];

    const TOTAL_SLOTS = 50;
    const MAX_VIDEOS = 50;

    function formatNumber(value) {

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "—";
      }

      return number.toLocaleString();

    }

    const container =
      document.getElementById("countries");

    countries.forEach(country => {

      const section =
        document.createElement("section");

      section.className = "country";

      const title =
        document.createElement("div");

      title.className = "country-name";

      title.innerHTML = `
        <div class="country-flag">${country.flag} ${country.name}</div>
        <div class="country-title"><span class="top-50">TOP 50</span> 👑 TRENDING VIDEOS 🔥</div>
      `;

      const slider =
        document.createElement("div");

      slider.className = "slider";

      for (let i = 0; i < TOTAL_SLOTS; i++) {

        const item =
          document.createElement("div");

        item.className = "item empty";

        item.innerHTML = `

          <div class="thumbnail"></div>

          <div class="video-title">
            TRENDING VIDEO
          </div>

          <div class="video-category">
            🎮 GAMING
          </div>

          <div class="score">

            <div class="score-item">
              🎮 GAMING
            </div>

            <div class="score-item">
              👤 —
            </div>

            <div class="score-item">
              👁 — views
            </div>

            <div class="score-item">
              📈 —/h
            </div>

            <div class="score-item">
              👍 — likes
            </div>

            <div class="score-item">
              💬 — comments
            </div>

          </div>

        `;

        slider.appendChild(item);

      }

      section.appendChild(title);
      section.appendChild(slider);
      container.appendChild(section);

      country.element = section;
      country.slider = slider;

      country.items =
        [...slider.querySelectorAll(".item")];

    });

    async function loadCountryVideos(country) {

      try {

        const response =
          await fetch(
            `/api/videos?regionCode=${encodeURIComponent(
              country.regionCode
            )}`
          );

        if (!response.ok) {

          throw new Error(
            `API error: ${response.status}`
          );

        }

        const data =
          await response.json();

        const videos =
          Array.isArray(data.videos)
            ? data.videos
            : [];

        insertVideos(
          country,
          videos.slice(0, MAX_VIDEOS)
        );

      } catch (error) {

        console.error(
          `Failed to load ${country.regionCode}:`,
          error
        );

      }

    }

    function insertVideos(country, videos) {

      videos.forEach((video, videoIndex) => {

        const item =
          country.items[videoIndex];

        if (!item) {
          return;
        }

        const thumbnail =
          item.querySelector(".thumbnail");

        const title =
          item.querySelector(".video-title");

        if (video.thumbnail) {

          const image =
            document.createElement("img");

          image.src =
            video.thumbnail;

          image.alt =
            video.title || "";

          image.loading =
            "lazy";

          thumbnail.appendChild(image);

        }

        title.textContent =
          video.title || "";

        const likes =
          video.likes == null
            ? "—"
            : formatNumber(video.likes);

        const views =
          video.views == null
            ? "—"
            : formatNumber(video.views);

        const comments =
          video.comments == null
            ? "—"
            : formatNumber(video.comments);

        const score =
          item.querySelector(".score");

        score.innerHTML = `

          <div class="score-item">
            🎮 GAMING
          </div>

          <div class="score-item">
            👤 ${video.channel_title || "—"}
          </div>

          <div class="score-item">
            👁 ${views} views
          </div>

          <div class="score-item">
            📈 —/h
          </div>

          <div class="score-item">
            👍 ${likes} likes
          </div>

          <div class="score-item">
            💬 ${comments} comments
          </div>

        `;

        item.dataset.videoId =
          video.video_id;

        item.classList.remove("empty");

        item.addEventListener(
          "click",
          () => {
            openPlayer(video.video_id);
          }
        );

      });

    }

    const playerOverlay =
      document.getElementById(
        "playerOverlay"
      );

    const youtubePlayer =
      document.getElementById(
        "youtubePlayer"
      );

    const closePlayer =
      document.getElementById(
        "closePlayer"
      );

    function openPlayer(videoId) {

      if (!videoId) {
        return;
      }

      youtubePlayer.src =
        `https://www.youtube-nocookie.com/embed/${encodeURIComponent(
          videoId
        )}?rel=0`;

      playerOverlay.classList.add(
        "active"
      );

    }

    function closeVideoPlayer() {

      youtubePlayer.src = "";

      playerOverlay.classList.remove(
        "active"
      );

    }

    closePlayer.addEventListener(
      "click",
      closeVideoPlayer
    );

    playerOverlay.addEventListener(
      "click",
      event => {

        if (event.target === playerOverlay) {
          closeVideoPlayer();
        }

      }
    );

    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "Escape") {
          closeVideoPlayer();
        }

      }
    );

    countries.forEach(country => {
      loadCountryVideos(country);
    });

  </script>

</body>

</html>
