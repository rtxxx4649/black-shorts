name: Repair and refresh snapshots

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-refresh
  cancel-in-progress: false

jobs:
  repair-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update YouTube database snapshot
        run: |
          curl --fail --show-error --silent --retry 3 \
            https://black-shorts-rtxxx4649.vercel.app/api/update-all

      - name: Build static YouTube snapshots
        run: |
          mkdir -p data/youtube
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          countries = [
              'US','GB','AU','CA','DE','PH','ES','FR','KR',
              'IT','VN','TR','IN','BR','ID','JP','MX','TH'
          ]
          base = 'https://black-shorts-rtxxx4649.vercel.app/api/videos?regionCode='

          for region in countries:
              target = Path('data/youtube') / f'{region}.json'
              raw = subprocess.check_output([
                  'curl', '--fail', '--show-error', '--silent', '--retry', '3',
                  f'{base}{region}'
              ], text=True)
              data = json.loads(raw)
              videos = data.get('videos') if isinstance(data, dict) else None
              if not isinstance(videos, list):
                  raise SystemExit(f'Invalid YouTube snapshot for {region}')
              if len(videos) != 50:
                  raise SystemExit(f'Expected 50 YouTube videos for {region}, got {len(videos)}')
              target.write_text(json.dumps({
                  'regionCode': region,
                  'count': len(videos),
                  'videos': videos
              }, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              print(f'{region}: {len(videos)} videos')
          PY

      - name: Update Twitch static snapshot
        run: |
          mkdir -p data
          curl --fail --show-error --silent --retry 3 \
            https://black-shorts-rtxxx4649.vercel.app/api/twitch \
            -o data/twitch.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/twitch.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(d, dict) or not isinstance(d.get('streams'), list):
              raise SystemExit('Invalid Twitch snapshot')
          print('Twitch streams:', len(d['streams']))
          PY

      - name: Convert frontend to static snapshot mode
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index2.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "fetch('/api/videos?regionCode='+c.regionCode)",
              "fetch('./data/youtube/'+c.regionCode+'.json')"
          )
          s = s.replace(
              "fetch(\"/api/videos?regionCode=\"+c.regionCode)",
              "fetch('./data/youtube/'+c.regionCode+'.json')"
          )
          s = s.replace(
              "const url=seen?'/api/twitch?seen='+encodeURIComponent(seen):'/api/twitch';",
              "const url='./data/twitch.json';"
          )
          s = s.replace(
              "const url=seen?\"/api/twitch?seen=\"+encodeURIComponent(seen):\"/api/twitch\";",
              "const url='./data/twitch.json';"
          )

          p.write_text(s, encoding='utf-8')
          Path('index.html').write_text(s, encoding='utf-8')
          PY

      - name: Validate static frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ('index.html', 'index2.html'):
              s = Path(name).read_text(encoding='utf-8')
              if "fetch('/api/videos" in s or 'fetch("/api/videos' in s:
                  raise SystemExit(f'{name}: YouTube API endpoint still present')
              if "'/api/twitch'" in s or '"/api/twitch"' in s:
                  raise SystemExit(f'{name}: Twitch API endpoint still present')
              if "./data/youtube/" not in s:
                  raise SystemExit(f'{name}: YouTube static snapshot path missing')
              if "./data/twitch.json" not in s:
                  raise SystemExit(f'{name}: Twitch static snapshot path missing')
          files = list(Path('data/youtube').glob('*.json'))
          if len(files) != 18:
              raise SystemExit(f'Expected 18 YouTube snapshot files, got {len(files)}')
          print('Validated 18 YouTube snapshots and static frontend files.')
          PY

      - name: Commit static snapshots and frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index2.html data/youtube data/twitch.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
          else
            git commit -m 'fix: serve video players from static snapshots'
            git push
          fi
