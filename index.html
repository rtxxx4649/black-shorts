<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Shorts</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #000; color: #fff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    #player { width: 100%; aspect-ratio: 16 / 9; }
    button { margin-top: 15px; padding: 10px 16px; cursor: pointer; }
    .info { margin-top: 10px; }
    .title { font-size: 20px; font-weight: bold; }
    .viewers { margin-top: 5px; color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <div id="player"></div>
    <div class="info">
      <div id="title" class="title"></div>
      <div id="viewers" class="viewers"></div>
    </div>
    <button id="next">次の配信</button>
  </div>

  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    let streams = [];
    let shownStreamIds = new Set();
    let currentStreamId = null;
    let player = null;

    async function fetchStreams() {
      const response = await fetch('/api/twitch');
      if (!response.ok) throw new Error('Failed to fetch Twitch streams');
      const data = await response.json();
      return Array.isArray(data.streams) ? data.streams : [];
    }

    function selectRandomStream() {
      const candidates = streams.filter(stream => !shownStreamIds.has(stream.id));
      if (candidates.length === 0) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function showStream(stream) {
      if (!stream) return false;

      currentStreamId = stream.id;
      shownStreamIds.add(stream.id);

      if (player) {
        player.setChannel(stream.user_login);
      } else {
        player = new Twitch.Player('player', {
          channel: stream.user_login,
          width: '100%',
          height: '100%',
        });
      }

      document.getElementById('title').textContent = stream.title || '';
      document.getElementById('viewers').textContent = `視聴者 ${Number(stream.viewer_count || 0).toLocaleString()}`;
      return true;
    }

    async function loadNextStream() {
      try {
        streams = await fetchStreams();
        const stream = selectRandomStream();
        if (!stream) {
          shownStreamIds.clear();
          const resetStream = selectRandomStream();
          if (!resetStream) return;
          showStream(resetStream);
          return;
        }
        showStream(stream);
      } catch (error) {
        console.error(error);
      }
    }

    document.getElementById('next').addEventListener('click', loadNextStream);

    loadNextStream();

    setInterval(async () => {
      try {
        const latestStreams = await fetchStreams();
        streams = latestStreams;

        if (currentStreamId) {
          const current = streams.find(stream => stream.id === currentStreamId);
          if (!current) {
            await loadNextStream();
          } else {
            document.getElementById('title').textContent = current.title || '';
            document.getElementById('viewers').textContent = `視聴者 ${Number(current.viewer_count || 0).toLocaleString()}`;
          }
        }
      } catch (error) {
        console.error(error);
      }
    }, 30000);
  </script>
</body>
</html>
