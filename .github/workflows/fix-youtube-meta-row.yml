name: Fix YouTube metadata row alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align creator metadata on one row
        shell: python
        run: |
          from pathlib import Path
          p = Path('index2.html')
          s = p.read_text()
          old = '.youtube-video-info{min-width:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}.youtube-video-channel{font-size:clamp(13px,1.4vw,20px);font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.youtube-video-stats{font-size:clamp(12px,1.2vw,18px);color:#bbb;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}'
          new = '.youtube-video-info{min-width:0;display:flex;flex-direction:row;align-items:center;gap:clamp(8px,1vw,14px);overflow:hidden;flex:1}.youtube-video-channel{font-size:clamp(13px,1.4vw,20px);font-weight:700;min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.youtube-video-stats{font-size:clamp(12px,1.2vw,18px);color:#bbb;flex:none;white-space:nowrap}'
          if old not in s:
              raise SystemExit('Expected YouTube row CSS was not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index2.html
          git rm .github/workflows/fix-youtube-meta-row.yml
          git commit -m "fix: keep YouTube creator metadata on one row"
          git push origin main
