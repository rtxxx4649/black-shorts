<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TREND SHORTS</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      padding: 40px 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .site-title {
      color: #fff;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .site-subtitle {
      color: #aaa;
      font-size: 18px;
      margin-top: 8px;
      white-space: nowrap;
    }

    /* =========================
       ADVERTISEMENT
       ========================= */

    .ad-space {
      width: calc(100% - 40px);
      height: 120px;
      margin: 0 20px 60px;
      background: #111;
    }

    /* =========================
       COUNTRY
       ========================= */

    .country {
      margin-bottom: 50px;
    }

    .country-name {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      padding: 0 20px;
      margin-bottom: 15px;
    }

    /* =========================
       SLIDER
       ========================= */

    .slider {
      display: flex;
      gap: 16px;

      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      padding: 0 20px;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    /* =========================
       VIDEO SLOT
       ========================= */

    .item {
      flex: 0 0 220px;
      width: 220px;
    }

    .thumbnail {
      position: relative;

      width: 100%;
      aspect-ratio: 9 / 16;

      background: #111;

      overflow: hidden;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    /* =========================
       EMPTY SLOT
       ========================= */

    .item.empty .thumbnail {
      background: #111;
    }

    /* =========================
       SCORE
       ========================= */

    .score {
      width: 100%;
      height: 40px;

      margin-top: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;

      font-size: 14px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding-top: 25px;
      }

      .site-title {
        font-size: 36px;
      }

      .site-subtitle {
        font-size: 15px;
      }

      .item {
        flex-basis: 180px;
        width: 180px;
      }

    }

  </style>

</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header class="header">

    <div class="site-title">
      TREND SHORTS
    </div>

    <div class="site-subtitle">
      DISCOVER WHAT'S TRENDING
    </div>

  </header>


  <!-- =========================
       ADVERTISEMENT
       ========================= -->

  <div class="ad-space"></div>


  <!-- =========================
       COUNTRY SLIDERS
       ========================= -->

  <main id="countries"></main>


  <script>

    /*
    ==========================================
    COUNTRIES
    ==========================================
    */

    const countries = [

      {
        flag: "🇺🇸",
        name: "UNITED STATES",
        regionCode: "US"
      },

      {
        flag: "🇬🇧",
        name: "UNITED KINGDOM",
        regionCode: "GB"
      },

      {
        flag: "🇦🇺",
        name: "AUSTRALIA",
        regionCode: "AU"
      },

      {
        flag: "🇨🇦",
        name: "CANADA",
        regionCode: "CA"
      },

      {
        flag: "🇩🇪",
        name: "GERMANY",
        regionCode: "DE"
      },

      {
        flag: "🇵🇭",
        name: "PHILIPPINES",
        regionCode: "PH"
      },

      {
        flag: "🇪🇸",
        name: "SPAIN",
        regionCode: "ES"
      },

      {
        flag: "🇫🇷",
        name: "FRANCE",
        regionCode: "FR"
      },

      {
        flag: "🇰🇷",
        name: "SOUTH KOREA",
        regionCode: "KR"
      },

      {
        flag: "🇮🇹",
        name: "ITALY",
        regionCode: "IT"
      },

      {
        flag: "🇻🇳",
        name: "VIETNAM",
        regionCode: "VN"
      },

      {
        flag: "🇹🇷",
        name: "TURKEY",
        regionCode: "TR"
      },

      {
        flag: "🇮🇳",
        name: "INDIA",
        regionCode: "IN"
      },

      {
        flag: "🇧🇷",
        name: "BRAZIL",
        regionCode: "BR"
      },

      {
        flag: "🇮🇩",
        name: "INDONESIA",
        regionCode: "ID"
      },

      {
        flag: "🇯🇵",
        name: "JAPAN",
        regionCode: "JP"
      },

      {
        flag: "🇲🇽",
        name: "MEXICO",
        regionCode: "MX"
      },

      {
        flag: "🇹🇭",
        name: "THAILAND",
        regionCode: "TH"
      }

    ];


    /*
    ==========================================
    UI SETTINGS
    ==========================================
    */

    // 1 country = 50 slots

    const TOTAL_SLOTS = 50;

    // Music mostPopular = maximum 10 videos

    const MAX_VIDEOS = 10;


    /*
    ==========================================
    CREATE COUNTRY UI
    ==========================================
    */

    const container =
      document.getElementById("countries");


    countries.forEach(country => {

      /*
      COUNTRY SECTION
      */

      const section =
        document.createElement("section");

      section.className =
        "country";


      /*
      COUNTRY NAME
      */

      const title =
        document.createElement("div");

      title.className =
        "country-name";

      title.textContent =
        `${country.flag} ${country.name}`;


      /*
      SLIDER
      */

      const slider =
        document.createElement("div");

      slider.className =
        "slider";


      /*
      CREATE 50 FIXED SLOTS
      */

      for (
        let i = 0;
        i < TOTAL_SLOTS;
        i++
      ) {

        const item =
          document.createElement("div");

        item.className =
          "item empty";


        item.innerHTML = `

          <div class="thumbnail"></div>

          <div class="score"></div>

        `;


        slider.appendChild(item);

      }


      /*
      ADD TO PAGE
      */

      section.appendChild(title);

      section.appendChild(slider);

      container.appendChild(section);


      /*
      SAVE REFERENCES
      */

      country.element =
        section;

      country.slider =
        slider;

      country.items =
        [
          ...slider.querySelectorAll(".item")
        ];

    });


    /*
    ==========================================
    LOAD COUNTRY VIDEOS
    ==========================================
    */

    async function loadCountryVideos(country) {

      try {

        const response =
          await fetch(
            `/api/youtube?regionCode=${encodeURIComponent(
              country.regionCode
            )}`
          );


        if (!response.ok) {

          throw new Error(
            `API error: ${response.status}`
          );

        }


        const data =
          await response.json();


        /*
        API CURRENTLY RETURNS:

        {
          regionCode,
          fetched,
          musicPopular
        }
        */


        const videos =
          Array.isArray(data.musicPopular)
            ? data.musicPopular
            : [];


        /*
        MAXIMUM 10
        */

        insertVideos(
          country,
          videos.slice(0, MAX_VIDEOS)
        );


      } catch (error) {

        console.error(
          `Failed to load ${country.regionCode}:`,
          error
        );

      }

    }


    /*
    ==========================================
    INSERT VIDEOS
    ==========================================
    */

    function insertVideos(
      country,
      videos
    ) {

      videos.forEach(
        (video, index) => {

          /*
          GET SLOT
          */

          const item =
            country.items[index];


          if (!item) {
            return;
          }


          /*
          GET ELEMENTS
          */

          const thumbnail =
            item.querySelector(
              ".thumbnail"
            );


          const score =
            item.querySelector(
              ".score"
            );


          /*
          THUMBNAIL
          */

          if (video.thumbnail) {

            const image =
              document.createElement(
                "img"
              );


            image.src =
              video.thumbnail;


            image.alt =
              video.title || "";


            image.loading =
              "lazy";


            thumbnail.appendChild(
              image
            );

          }


          /*
          VIEW COUNT
          */

          score.textContent =
            Number(
              video.views || 0
            ).toLocaleString();


          /*
          MARK SLOT AS ACTIVE
          */

          item.classList.remove(
            "empty"
          );

        }
      );

    }


    /*
    ==========================================
    LOAD ALL COUNTRIES
    ==========================================
    */

    countries.forEach(
      country => {
        loadCountryVideos(country);
      }
    );

  </script>

</body>

</html>
