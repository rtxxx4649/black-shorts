<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TREND SHORTS</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      padding: 40px 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .site-title {
      color: #fff;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .site-subtitle {
      color: #aaa;
      font-size: 18px;
      margin-top: 8px;
      white-space: nowrap;
    }


    /* =========================
       ADVERTISEMENT
       ========================= */

    .ad-space {
      width: calc(100% - 40px);
      height: 120px;

      margin: 0 20px 60px;

      background: #111;
    }


    /* =========================
       COUNTRY
       ========================= */

    .country {
      margin-bottom: 55px;
    }

    .country-name {
      color: #fff;

      font-size: 20px;
      font-weight: 600;

      padding: 0 20px;

      margin-bottom: 18px;
    }


    /* =========================
       SLIDER
       ========================= */

    .slider {
      display: flex;

      gap: 24px;

      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      padding: 0 20px;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }


    /* =========================
       VIDEO CARD
       ========================= */

    .item {
      flex: 0 0 300px;

      width: 300px;

      cursor: pointer;
    }


    /* =========================
       THUMBNAIL
       ========================= */

    .thumbnail {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #111;

      overflow: hidden;

      border-radius: 2px;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =========================
       VIDEO TITLE
       ========================= */

    .video-title {
      width: 100%;

      margin-top: 12px;

      color: #fff;

      font-size: 15px;

      font-weight: 500;

      line-height: 1.4;

      height: 63px;

      display: -webkit-box;

      -webkit-box-orient: vertical;

      -webkit-line-clamp: 3;

      overflow: hidden;

      word-break: break-word;
    }


    /* =========================
       CATEGORY
       ========================= */

    .video-category {
      width: 100%;

      margin-top: 10px;

      color: #fff;

      font-size: 13px;

      font-weight: 600;

      line-height: 1.4;
    }


    /* =========================
       SCORE
       ========================= */

    .score {
      width: 100%;

      margin-top: 0;

      color: #aaa;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =========================
       YOUTUBE PLAYER
       ========================= */

    .player-overlay {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.95);
    }

    .player-overlay.active {
      display: flex;
    }

    .player-container {
      position: relative;

      width: min(1000px, 94vw);

      aspect-ratio: 16 / 9;

      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;

      border: 0;

      display: block;
    }

    .close-player {
      position: absolute;

      top: -45px;
      right: 0;

      width: 36px;
      height: 36px;

      border: 0;

      border-radius: 50%;

      background: #fff;

      color: #000;

      font-size: 22px;

      line-height: 36px;

      cursor: pointer;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding-top: 25px;
      }

      .site-title {
        font-size: 36px;
      }

      .site-subtitle {
        font-size: 15px;
      }

      .country {
        margin-bottom: 45px;
      }

      .item {
        flex-basis: 270px;

        width: 270px;
      }

      .video-title {
        font-size: 14px;

        height: 58.8px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <header class="header">

    <div class="site-title">
      TREND SHORTS
    </div>

    <div class="site-subtitle">
      DISCOVER WHAT'S TRENDING
    </div>

  </header>


  <!-- =========================
       ADVERTISEMENT
       ========================= -->

  <div class="ad-space"></div>


  <!-- =========================
       COUNTRY SLIDERS
       ========================= -->

  <main id="countries"></main>


  <!-- =========================
       YOUTUBE PLAYER
       ========================= -->

  <div
    id="playerOverlay"
    class="player-overlay"
  >

    <div class="player-container">

      <button
        id="closePlayer"
        class="close-player"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

      <iframe
        id="youtubePlayer"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

    </div>

  </div>


  <script>


    /*
    ==========================================
       COUNTRIES
    ==========================================
    */

    const countries = [

      {
        flag: "🇺🇸",
        name: "UNITED STATES",
        regionCode: "US"
      },

      {
        flag: "🇬🇧",
        name: "UNITED KINGDOM",
        regionCode: "GB"
      },

      {
        flag: "🇦🇺",
        name: "AUSTRALIA",
        regionCode: "AU"
      },

      {
        flag: "🇨🇦",
        name: "CANADA",
        regionCode: "CA"
      },

      {
        flag: "🇩🇪",
        name: "GERMANY",
        regionCode: "DE"
      },

      {
        flag: "🇵🇭",
        name: "PHILIPPINES",
        regionCode: "PH"
      },

      {
        flag: "🇪🇸",
        name: "SPAIN",
        regionCode: "ES"
      },

      {
        flag: "🇫🇷",
        name: "FRANCE",
        regionCode: "FR"
      },

      {
        flag: "🇰🇷",
        name: "SOUTH KOREA",
        regionCode: "KR"
      },

      {
        flag: "🇮🇹",
        name: "ITALY",
        regionCode: "IT"
      },

      {
        flag: "🇻🇳",
        name: "VIETNAM",
        regionCode: "VN"
      },

      {
        flag: "🇹🇷",
        name: "TURKEY",
        regionCode: "TR"
      },

      {
        flag: "🇮🇳",
        name: "INDIA",
        regionCode: "IN"
      },

      {
        flag: "🇧🇷",
        name: "BRAZIL",
        regionCode: "BR"
      },

      {
        flag: "🇮🇩",
        name: "INDONESIA",
        regionCode: "ID"
      },

      {
        flag: "🇯🇵",
        name: "JAPAN",
        regionCode: "JP"
      },

      {
        flag: "🇲🇽",
        name: "MEXICO",
        regionCode: "MX"
      },

      {
        flag: "🇹🇭",
        name: "THAILAND",
        regionCode: "TH"
      }

    ];


    /*
    ==========================================
       SETTINGS
    ==========================================

       20 FIXED SLOTS
       MAXIMUM 20 VIDEOS
    */

    const TOTAL_SLOTS = 20;

    const MAX_VIDEOS = 20;


    /*
    ==========================================
       SHUFFLE
    ==========================================

       Fisher-Yates shuffle

       Each country is shuffled
       independently.
    */

    function shuffle(array) {

      const result = [...array];

      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }

      return result;

    }


    /*
    ==========================================
       CREATE COUNTRY UI
    ==========================================
    */

    const container =
      document.getElementById(
        "countries"
      );


    countries.forEach(
      country => {

        const section =
          document.createElement(
            "section"
          );

        section.className =
          "country";


        /*
        COUNTRY NAME
        */

        const title =
          document.createElement(
            "div"
          );

        title.className =
          "country-name";

        title.textContent =
          `${country.flag} ${country.name}`;


        /*
        SLIDER
        */

        const slider =
          document.createElement(
            "div"
          );

        slider.className =
          "slider";


        /*
        CREATE 20 FIXED SLOTS
        */

        for (
          let i = 0;
          i < TOTAL_SLOTS;
          i++
        ) {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "item empty";


          item.innerHTML = `

            <div class="thumbnail"></div>

            <div class="video-title"></div>

            <div class="video-category"></div>

            <div class="score"></div>

          `;


          slider.appendChild(
            item
          );

        }


        section.appendChild(
          title
        );

        section.appendChild(
          slider
        );

        container.appendChild(
          section
        );


        /*
        SAVE REFERENCES
        */

        country.element =
          section;

        country.slider =
          slider;

        country.items =
          [
            ...slider.querySelectorAll(
              ".item"
            )
          ];

      }
    );


    /*
    ==========================================
       LOAD COUNTRY VIDEOS
    ==========================================
    */

    async function loadCountryVideos(
      country
    ) {

      try {

        const response =
          await fetch(
            `/api/youtube?regionCode=${encodeURIComponent(
              country.regionCode
            )}`
          );


        if (!response.ok) {

          throw new Error(
            `API error: ${response.status}`
          );

        }


        const data =
          await response.json();


        /*
        GAMING POPULAR
        */

        const videos =
          Array.isArray(
            data.gamingPopular
          )
            ? data.gamingPopular
            : [];


        /*
        MAXIMUM 20
        */

        insertVideos(
          country,

          videos.slice(
            0,
            MAX_VIDEOS
          )
        );


      } catch (error) {

        console.error(
          `Failed to load ${country.regionCode}:`,
          error
        );

      }

    }


    /*
    ==========================================
       INSERT VIDEOS
    ==========================================
    */

    function insertVideos(
      country,
      videos
    ) {


      /*
      RANDOM POSITIONS

      20 slotsから動画本数分だけ
      ランダムに選択。

      国ごとに独立している。
      */

      const positions =
        shuffle(
          [
            ...Array(
              TOTAL_SLOTS
            ).keys()
          ]
        ).slice(
          0,
          videos.length
        );


      videos.forEach(
        (video, videoIndex) => {

          const slotIndex =
            positions[
              videoIndex
            ];


          const item =
            country.items[
              slotIndex
            ];


          if (!item) {
            return;
          }


          const thumbnail =
            item.querySelector(
              ".thumbnail"
            );


          const title =
            item.querySelector(
              ".video-title"
            );


          const category =
            item.querySelector(
              ".video-category"
            );


          const score =
            item.querySelector(
              ".score"
            );


          /*
          THUMBNAIL
          */

          if (video.thumbnail) {

            const image =
              document.createElement(
                "img"
              );

            image.src =
              video.thumbnail;

            image.alt =
              video.title || "";

            image.loading =
              "lazy";

            thumbnail.appendChild(
              image
            );

          }


          /*
          TITLE
          */

          title.textContent =
            video.title || "";


          /*
          CATEGORY
          */

          category.textContent =
            "🎮 GAMING";


          /*
          VIEWS
          */

          const views =
            Number(
              video.views || 0
            ).toLocaleString();


          /*
          SCORE

          YouTube Data APIから
          現在取得できる情報のみ表示。

          投稿時間は表示しない。
          */

          score.innerHTML = `

            🔥 — Trending<br>

            👁 ${views} views<br>

            📈 — / last hour

          `;


          /*
          VIDEO ID
          */

          item.dataset.videoId =
            video.id;


          /*
          ACTIVE CARD
          */

          item.classList.remove(
            "empty"
          );


          /*
          CLICK TO PLAY
          */

          item.addEventListener(
            "click",
            () => {

              openPlayer(
                video.id
              );

            }
          );

        }
      );

    }


    /*
    ==========================================
       YOUTUBE PLAYER
    ==========================================
    */

    const playerOverlay =
      document.getElementById(
        "playerOverlay"
      );


    const youtubePlayer =
      document.getElementById(
        "youtubePlayer"
      );


    const closePlayer =
      document.getElementById(
        "closePlayer"
      );


    /*
    OPEN PLAYER
    */

    function openPlayer(
      videoId
    ) {

      if (!videoId) {
        return;
      }


      /*
      YOUTUBE PRIVACY-ENHANCED MODE

      youtube-nocookie.com
      */

      youtubePlayer.src =
        `https://www.youtube-nocookie.com/embed/${encodeURIComponent(
          videoId
        )}?rel=0`;


      playerOverlay.classList.add(
        "active"
      );

    }


    /*
    CLOSE PLAYER
    */

    function closeVideoPlayer() {

      youtubePlayer.src = "";

      playerOverlay.classList.remove(
        "active"
      );

    }


    /*
    CLOSE BUTTON
    */

    closePlayer.addEventListener(
      "click",
      closeVideoPlayer
    );


    /*
    CLOSE BACKGROUND
    */

    playerOverlay.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          playerOverlay
        ) {

          closeVideoPlayer();

        }

      }
    );


    /*
    ESC KEY
    */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeVideoPlayer();

        }

      }
    );


    /*
    ==========================================
       LOAD ALL COUNTRIES
    ==========================================
    */

    countries.forEach(
      country => {

        loadCountryVideos(
          country
        );

      }
    );


  </script>

</body>

</html>
