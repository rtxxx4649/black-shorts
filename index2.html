<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TREND HUB</title><style>*{box-sizing:border-box}html{overflow-anchor:none}body{margin:0;background:#1B102B;color:#fff;font-family:Arial,sans-serif}.header{padding:0 20px 500px;background:linear-gradient(90deg,#0004,#0001,#0004),url('./e2e1003b-f8c4-4441-924c-df430cc634a5.png') center/cover;text-align:left}.site-title{font-size:clamp(22.5px,2.5vw,30px);font-weight:700;text-align:left}.e{color:red}.site-subtitle{color:#aaa;font-size:clamp(9px,1vw,11px);margin-top:8px;text-align:left}.twitch-section{background:#000;padding:0 0 30px}.twitch-heading{text-align:center;font-size:30px;font-weight:700;margin-bottom:18px}.twitch-player{width:100%;max-width:none;margin:0;background:#111;border:1px solid #333;display:grid;grid-template-columns:2fr 1fr;height:56.25vw;aspect-ratio:auto}.twitch-player.twitch-player-floating{position:fixed;top:0;left:0;width:100vw;max-width:100vw;height:56.25vw;margin:0;z-index:1000;aspect-ratio:auto}.twitch-video-frame,.twitch-chat-frame{width:100%;height:100%;border:0;background:#111}.twitch-loading,.twitch-error{height:100%;min-height:240px;display:flex;align-items:center;justify-content:center;color:#bbb;text-align:center;padding:20px}.twitch-switch-controls,.youtube-switch-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px auto;width:min(100%,1000px)}.twitch-switch-controls button:last-child,.youtube-switch-controls button:last-child{grid-column:1 / -1}button{border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:17px;font-weight:700;min-width:145px;height:46px;cursor:pointer}button:disabled{opacity:.5}.youtube-section{background:#000;padding:0}.youtube-player{width:100%;height:56.25vw;background:#111}.youtube-player iframe{display:block;width:100%;height:100%;border:0}.youtube-switch-controls{margin-bottom:0}.country-name{background:#000;text-align:center;padding:18px}.country-location{font-size:30px;font-weight:600}.slider{display:flex;gap:24px;overflow-x:auto;padding:0 20px}.item{flex:0 0 300px;background:#000;padding:10px}.thumbnail{aspect-ratio:16/9;background:#111}.thumbnail img{width:100%;height:100%;object-fit:cover}.video-title{margin-top:10px;height:63px;overflow:hidden}.score{display:grid;grid-template-columns:1fr 1fr;font-size:14px;margin-top:10px}.twitch-stream-title{display:none}.twitch-stream-meta{display:none}@media(max-width:700px){.header{padding-bottom:120px;margin-bottom:0;text-align:left}.site-title,.site-subtitle{text-align:left;margin-left:0}.twitch-stream-title{display:block;background:#000;color:#fff;padding:10px 12px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.twitch-stream-meta{display:flex;align-items:center;gap:8px;background:#000;color:#fff;height:calc(2cm - 38px);padding:4px 12px 10px;overflow:hidden}.twitch-stream-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}.twitch-stream-name{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.twitch-stream-viewers{font-size:12px;color:#bbb;white-space:nowrap}.twitch-player{display:grid;grid-template-columns:1fr;overflow:hidden;aspect-ratio:auto;width:100%;height:56.25vw}.twitch-video-frame{width:100%;height:100%}.twitch-chat-frame{display:none}.item{flex-basis:270px}.country-location{font-size:25px}.youtube-player{width:100%;height:56.25vw}.youtube-switch-controls{margin-bottom:0}}@media(max-width:700px) and (orientation:landscape){.twitch-player{aspect-ratio:auto;width:100%;height:56.25vw}.twitch-video-frame{width:100%;height:100%}.youtube-player{width:100%;height:56.25vw}}@media(min-width:701px){.header{padding-bottom:442px}.site-title{font-size:clamp(90px,10vw,120px)}.site-subtitle{font-size:clamp(36px,4vw,44px)}.twitch-player{width:100%;aspect-ratio:auto;height:56.25vw}.twitch-switch-controls button:last-child{transform:translateY(10px)}.youtube-player{width:100%;height:56.25vw}.youtube-switch-controls{margin-bottom:0}} </style></head><body><header class="header"><div class="site-title">TR<span class="e">E</span>ND HUB</div><div class="site-subtitle">DISCOVER WHAT'S TRENDING</div></header><section class="twitch-section" id="twitch"><div class="twitch-stream-title" id="twitchStreamTitle"></div><div class="twitch-stream-meta" id="twitchStreamMeta"><img class="twitch-stream-avatar" id="twitchStreamAvatar" alt=""><span class="twitch-stream-name" id="twitchStreamName"></span><span class="twitch-stream-viewers" id="twitchStreamViewers"></span></div><div class="twitch-player" id="twitchPlayerArea"><div class="twitch-loading">Twitch LIVEを読み込み中…</div></div><div class="twitch-switch-controls"><button id="twitchMuteButton">Mute</button><button id="twitchNextButton">Next Stream</button></div></section><section class="youtube-section" id="youtube"><div class="youtube-player" id="youtubePlayerArea"><div class="twitch-loading">YouTube動画を読み込み中…</div></div><div class="youtube-switch-controls"><button id="youtubeMuteButton">Unmute</button><button id="youtubeNextButton">Next Video</button></div></section><script src="https://player.twitch.tv/js/embed/v1.js"></script><script>const countries=[['🇺🇸','UNITED STATES','US'],['🇬🇧','UNITED KINGDOM','GB'],['🇦🇺','AUSTRALIA','AU'],['🇨🇦','CANADA','CA'],['🇩🇪','GERMANY','DE'],['🇵🇭','PHILIPPINES','PH'],['🇪🇸','SPAIN','ES'],['🇫🇷','FRANCE','FR'],['🇰🇷','SOUTH KOREA','KR'],['🇮🇹','ITALY','IT'],['🇻🇳','VIETNAM','VN'],['🇹🇷','TURKEY','TR'],['🇮🇳','INDIA','IN'],['🇧🇷','BRAZIL','BR'],['🇮🇩','INDONESIA','ID'],['🇯🇵','JAPAN','JP'],['🇲🇽','MEXICO','MX'],['🇹🇭','THAILAND','TH']].map(x=>({flag:x[0],name:x[1],regionCode:x[2]}));let youtubeVideos=[],youtubeUsedIds=new Set(),youtubePlayer=null,youtubeReady=false,currentYouTubeVideo=null,youtubeMuted=true;async function loadYouTubeVideos(){const results=await Promise.all(countries.map(async c=>{try{const r=await fetch('/api/videos?regionCode='+c.regionCode);if(!r.ok)throw Error(r.status);const d=await r.json();return Array.isArray(d.videos)?d.videos.slice(0,50):[]}catch(e){console.error(e);return []}}));youtubeVideos=results.flat().filter(v=>v&&v.video_id);if(youtubeReady&&!currentYouTubeVideo)playRandomYouTubeVideo()}function getNextYouTubeVideo(){if(!youtubeVideos.length)return null;if(youtubeUsedIds.size>=youtubeVideos.length)youtubeUsedIds.clear();const available=youtubeVideos.filter(v=>!youtubeUsedIds.has(v.video_id));if(!available.length){youtubeUsedIds.clear();return youtubeVideos[Math.floor(Math.random()*youtubeVideos.length)]}const selected=available[Math.floor(Math.random()*available.length)];youtubeUsedIds.add(selected.video_id);return selected}function playRandomYouTubeVideo(){const video=getNextYouTubeVideo();if(!video||!youtubePlayer)return;currentYouTubeVideo=video;youtubePlayer.loadVideoById(video.video_id);youtubePlayer.mute();youtubeMuted=true;document.getElementById('youtubeMuteButton').textContent='Unmute'}function onYouTubeIframeAPIReady(){youtubePlayer=new YT.Player('youtubePlayerArea',{width:'100%',height:'100%',videoId:'',playerVars:{autoplay:1,mute:1,rel:0,playsinline:1},events:{onReady:function(){youtubeReady=true;if(youtubeVideos.length){const video=getNextYouTubeVideo();if(video){currentYouTubeVideo=video;youtubePlayer.loadVideoById({videoId:video.video_id,startSeconds:0,suggestedQuality:'default'});youtubePlayer.mute();youtubePlayer.playVideo();youtubeMuted=true;document.getElementById('youtubeMuteButton').textContent='Unmute'}}},onStateChange:function(event){if(event.data===YT.PlayerState.ENDED)playRandomYouTubeVideo()}}})}document.getElementById('youtubeMuteButton').onclick=()=>{if(!youtubePlayer)return;try{if(youtubeMuted){youtubePlayer.unMute();youtubeMuted=false;document.getElementById('youtubeMuteButton').textContent='Mute'}else{youtubePlayer.mute();youtubeMuted=true;document.getElementById('youtubeMuteButton').textContent='Unmute'}}catch(e){console.error(e)}};document.getElementById('youtubeNextButton').onclick=()=>{playRandomYouTubeVideo()};loadYouTubeVideos();let player=null,playing=false,login='',busy=false;const seenTwitchStreamers=new Set();const twitchMuteButton=document.getElementById('twitchMuteButton');function setTwitchMuteButton(){if(!player)return;try{const muted=player.getMuted();twitchMuteButton.textContent=muted?'Unmute':'Mute'}catch(e){twitchMuteButton.textContent='Mute'}}function createPlayer(name,autoplay){const a=document.getElementById('twitchPlayerArea');a.innerHTML='';const v=document.createElement('div');v.className='twitch-video-frame';a.appendChild(v);const chat=document.createElement('iframe');chat.className='twitch-chat-frame';chat.src='https://www.twitch.tv/embed/'+encodeURIComponent(name)+'/chat?parent='+encodeURIComponent(location.hostname)+'&darkpopout';chat.allow='autoplay;fullscreen';a.appendChild(chat);if(!window.Twitch||!Twitch.Player)throw Error('Twitch Player API unavailable');player=new Twitch.Player(v,{channel:name,width:'100%',height:'100%',autoplay:true,muted:false,parent:[location.hostname]});setTwitchMuteButton();player.addEventListener(Twitch.Player.PLAY,()=>{try{player.setMuted(false)}catch(e){}setTwitchMuteButton()});player.addEventListener(Twitch.Player.PLAYING,()=>{try{player.setMuted(false)}catch(e){}setTwitchMuteButton()});player.addEventListener(Twitch.Player.READY,()=>{try{player.setMuted(false);player.play()}catch(e){}setTwitchMuteButton()})}async function loadTwitch(autoplay=false){try{const seen=[...seenTwitchStreamers].join(',');const url=seen?'/api/twitch?seen='+encodeURIComponent(seen):'/api/twitch';const r=await fetch(url);if(!r.ok)throw Error(r.status);const d=await r.json();const streams=Array.isArray(d.streams)?d.streams:[];if(!streams.length){document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-error">現在表示できる未視聴のTwitch LIVEがありません。</div>';player=null;return}const selected=streams[Math.floor(Math.random()*streams.length)];login=selected.user_login;document.getElementById('twitchStreamTitle').textContent=selected.title||'';document.getElementById('twitchStreamAvatar').src=selected.profile_image_url||'';document.getElementById('twitchStreamName').textContent=selected.user_name||selected.user_login||'';document.getElementById('twitchStreamViewers').textContent=Number(selected.viewer_count||0).toLocaleString('en-US')+' viewers';seenTwitchStreamers.add(login.toLowerCase());createPlayer(login,autoplay)}catch(e){console.error(e);document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-error">Twitch LIVEの読み込みに失敗しました。</div>';player=null}}twitchMuteButton.onclick=()=>{if(!player)return;try{const muted=player.getMuted();player.setMuted(!muted);setTwitchMuteButton()}catch(e){console.error(e)}};document.getElementById('twitchNextButton').onclick=async()=>{if(busy)return;busy=true;const b=document.getElementById('twitchNextButton');b.disabled=true;document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-loading">次のTwitch LIVEを読み込み中…</div>';try{await loadTwitch(true)}finally{busy=false;b.disabled=false}};loadTwitch(false);</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
