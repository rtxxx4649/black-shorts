<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREND HUB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--site-scale:1}
html,body{width:100%;min-height:100%;background:#1B102B}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden}
.header{position:relative;padding:calc(110px * var(--site-scale)) calc(20px * var(--site-scale)) calc(180px * var(--site-scale));overflow:hidden;background-image:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,.08) 55%,rgba(0,0,0,.2)),url("./e2e1003b-f8c4-4441-924c-df430cc634a5.png");background-size:cover;background-position:center;background-repeat:no-repeat}
.site-title{font-size:calc(60px * var(--site-scale));font-weight:700;line-height:1;white-space:nowrap}.site-title .trend{color:#fff}.site-title .e{color:#f00}.site-title .hub{color:#fff}.site-subtitle{color:#aaa;font-size:calc(22.5px * var(--site-scale));margin-top:calc(8px * var(--site-scale));white-space:nowrap}
.twitch-section{background:#000;padding:24px 20px 28px}.twitch-heading{text-align:center;font-size:30px;font-weight:700;margin-bottom:18px;display:none}.twitch-stream-info{width:min(100%,1000px);margin:14px auto 0;text-align:center}.twitch-stream-title{font-size:16px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}.twitch-stream-viewers{margin-top:6px;color:#bbb;font-size:16px;display:none}.twitch-player{width:min(100%,1000px);margin:0 auto;background:#111;border:1px solid #333;display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);aspect-ratio:16/9}.twitch-video-frame,.twitch-chat-frame{width:100%;height:100%;border:0;display:block;background:#111}.twitch-loading,.twitch-error{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:18px;text-align:center;padding:20px}.twitch-switch-controls{display:flex;width:min(100%,1000px);margin:10px auto 0;justify-content:center;gap:12px;flex-wrap:wrap}
.twitch-switch-button{border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:18px;font-weight:700;line-height:1;width:auto;min-width:160px;height:46px;cursor:pointer;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:9px}.twitch-switch-button:active{background:#222}.twitch-switch-button:disabled{opacity:.5;cursor:default}.twitch-switch-button svg{width:19px;height:19px;flex:0 0 19px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.twitch-top-games-heading{text-align:center;font-size:20px;font-weight:700;margin-top:24px}.twitch-ranking-wrap{margin-top:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.twitch-ranking-wrap::-webkit-scrollbar{display:none}.twitch-ranking-track{display:flex;gap:16px;width:max-content}.twitch-ranking-page{width:min(360px,calc(100vw - 40px));scroll-snap-align:start;background:#161616;border:1px solid #333;padding:16px}.twitch-game-name{text-align:center;font-size:22px;font-weight:700;margin-bottom:14px}.twitch-game-image{width:100%;aspect-ratio:3/4;object-fit:cover;background:#111;display:block;margin-bottom:12px}.twitch-game-rank{text-align:center;font-size:16px;color:#bbb;margin-bottom:8px}.twitch-streamer{padding:12px 0;border-top:1px solid #333}.twitch-streamer-name{font-size:18px;font-weight:700}.twitch-streamer-meta{margin-top:6px;color:#bbb;font-size:14px}
.youtube-section-heading{background:#000;padding:24px 20px 12px;text-align:center}.youtube-section-heading a{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:30px;font-weight:700}.youtube-logo{width:38px;display:block}
.country{margin:0}.country-name{width:100%;color:#fff;background:#000;text-align:center;padding:calc(18px * var(--site-scale)) calc(12px * var(--site-scale))}.country-location{display:flex;align-items:center;justify-content:center;gap:calc(8px * var(--site-scale));width:100%;font-size:calc(30px * var(--site-scale));font-weight:600;white-space:nowrap}.slider-wrap{position:relative;width:100%}.slider{display:flex;gap:calc(24px * var(--site-scale));width:100%;overflow-x:auto;padding:0 calc(20px * var(--site-scale));scrollbar-width:none}.slider::-webkit-scrollbar{display:none}.slider-button{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:calc(54px * var(--site-scale));height:calc(54px * var(--site-scale));border:0;border-radius:50%;background:#000;color:#fff;font-size:36px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer}.slider-button.left{left:10px}.slider-button.right{right:10px}.item{flex:0 0 calc(300px * var(--site-scale));width:calc(300px * var(--site-scale));cursor:pointer;background:#000;padding:calc(10px * var(--site-scale))}.thumbnail{width:100%;aspect-ratio:16/9;background:#111;overflow:hidden}.thumbnail img{width:100%;height:100%;object-fit:cover;display:block}.video-title{margin-top:12px;color:#fff;font-size:calc(15px * var(--site-scale));line-height:1.4;height:63px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.score{margin-top:10px;color:#fff;font-size:calc(15px * var(--site-scale));line-height:1.6;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}.score-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.95)}.player-overlay.active{display:flex}.player-container{position:relative;width:min(1000px,94vw);aspect-ratio:16/9;background:#000}.player-container iframe{width:100%;height:100%;border:0}.close-player{position:absolute;top:-45px;right:0;width:36px;height:36px;border:0;border-radius:50%;background:#fff;color:#000;font-size:22px;cursor:pointer}
@media(min-width:601px){.slider-button{display:flex}}@media(min-width:701px){.twitch-switch-controls{display:grid;grid-template-columns:max-content max-content;justify-content:center;gap:12px}.twitch-switch-button:nth-child(3){grid-column:1 / -1;justify-self:center}}@media(max-width:700px){.twitch-section{padding:20px 12px 24px}.twitch-heading{font-size:26px}.twitch-stream-title{font-size:15px}.twitch-stream-viewers{font-size:15px}.twitch-player{display:block;aspect-ratio:16/9;overflow:hidden;height:auto}.twitch-video-frame{width:100%;min-width:0;height:100%;min-height:0;transform:none;transform-origin:top left}.twitch-chat-frame{display:none}.twitch-ranking-page{width:calc(100vw - 24px)}.twitch-switch-button{font-size:17px;min-width:145px;height:44px}}
@media(max-width:600px){.header{padding:calc(90px * var(--site-scale)) 20px calc(160px * var(--site-scale))}.site-title{font-size:calc(45px * var(--site-scale))}.site-subtitle{font-size:calc(18.75px * var(--site-scale));margin-top:calc(8px * var(--site-scale))}.country-name{padding:calc(16px * var(--site-scale)) 10px}.country-location{font-size:calc(25px * var(--site-scale))}.item{flex-basis:calc(270px * var(--site-scale));width:calc(270px * var(--site-scale))}.video-title{font-size:calc(14px * var(--site-scale));height:58.8px}.score{font-size:calc(14px * var(--site-scale));gap:2px 8px}.twitch-switch-button{font-size:16px;min-width:140px;padding:0 10px}}
</style>
</head>
<body>
<header class="header"><div class="site-title"><span class="trend">TR</span><span class="e">E</span><span class="trend">ND</span><span class="hub"> HUB</span></div><div class="site-subtitle">DISCOVER WHAT'S TRENDING</div></header>
<section class="twitch-section" id="twitch">
<div class="twitch-heading">TWITCH</div>
<div class="twitch-player" id="twitchPlayerArea"><div class="twitch-loading">Twitch LIVEを読み込み中…</div></div>
<div class="twitch-stream-info" id="twitchStreamInfo" hidden><div class="twitch-stream-title" id="twitchStreamTitle"></div><div class="twitch-stream-viewers" id="twitchStreamViewers"></div></div>
<div class="twitch-switch-controls" id="twitchSwitchControls" aria-label="Twitch live controls">
<button class="twitch-switch-button" id="twitchWatchLiveButton" type="button" aria-label="Watch Live"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5.64 5.64a9 9 0 0 0 0 12.72"></path><path d="M18.36 5.64a9 9 0 0 1 0 12.72"></path></svg><span>Watch Live</span></button>
<button class="twitch-switch-button" id="twitchNextButton" type="button" aria-label="Next Stream"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l9-7z"></path><path d="M19 5v14"></path></svg><span>Next Stream</span></button>
<button class="twitch-switch-button" id="twitchPlayPauseButton" type="button" aria-label="Play or Pause"><svg id="twitchPlayPauseIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg><span>Play / Pause</span></button>
</div>
<div class="twitch-top-games-heading">TOP 5 GAMES</div>
<div class="twitch-ranking-wrap" aria-label="Twitch game rankings"><div class="twitch-ranking-track" id="twitchRankingTrack"><div class="twitch-ranking-page"><div class="twitch-game-name">読み込み中…</div></div></div></div>
</section>
<section class="youtube-section-heading"><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><svg class="youtube-logo" viewBox="0 0 159 110" aria-hidden="true"><path d="M154.5 17.5c-1.8-6.7-7.1-12-13.8-13.8C128.5.5 79.5.5 79.5.5S30.5.5 18.3 3.7C11.6 5.5 6.3 10.8 4.5 17.5 1.3 29.7 1.3 55 1.3 55s0 25.3 3.2 37.5c1.8 6.7 7.1 12 13.8 13.8 12.2 3.2 61.2 3.2 61.2 3.2s49 0 61.2-3.2c6.7-1.8 12-7.1 13.8-13.8 3.2-12.2 3.2-37.5 3.2-37.5s0-25.3-3.2-37.5z" fill="#FF0000"/><path d="M63.7 79.5V30.5L106 55 63.7 79.5z" fill="#fff"/></svg><span>YouTube</span></a></section>
<main id="countries"></main>
<div id="playerOverlay" class="player-overlay"><div class="player-container"><button id="closePlayer" class="close-player" type="button">×</button><iframe id="youtubePlayer" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></div>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
function updateSiteScale(){const w=window.innerWidth;document.documentElement.style.setProperty('--site-scale',Math.min(1,Math.max(.6,w/1200)))}updateSiteScale();window.addEventListener('resize',updateSiteScale);
const countries=[{flag:'🇺🇸',name:'UNITED STATES',regionCode:'US'},{flag:'🇬🇧',name:'UNITED KINGDOM',regionCode:'GB'},{flag:'🇦🇺',name:'AUSTRALIA',regionCode:'AU'},{flag:'🇨🇦',name:'CANADA',regionCode:'CA'},{flag:'🇩🇪',name:'GERMANY',regionCode:'DE'},{flag:'🇵🇭',name:'PHILIPPINES',regionCode:'PH'},{flag:'🇪🇸',name:'SPAIN',regionCode:'ES'},{flag:'🇫🇷',name:'FRANCE',regionCode:'FR'},{flag:'🇰🇷',name:'SOUTH KOREA',regionCode:'KR'},{flag:'🇮🇹',name:'ITALY',regionCode:'IT'},{flag:'🇻🇳',name:'VIETNAM',regionCode:'VN'},{flag:'🇹🇷',name:'TURKEY',regionCode:'TR'},{flag:'🇮🇳',name:'INDIA',regionCode:'IN'},{flag:'🇧🇷',name:'BRAZIL',regionCode:'BR'},{flag:'🇮🇩',name:'INDONESIA',regionCode:'ID'},{flag:'🇯🇵',name:'JAPAN',regionCode:'JP'},{flag:'🇲🇽',name:'MEXICO',regionCode:'MX'},{flag:'🇹🇭',name:'THAILAND',regionCode:'TH'}];
function formatNumber(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString():'—'}
const container=document.getElementById('countries');const shuffledCountries=[...countries].sort(()=>Math.random()-.5);
shuffledCountries.forEach(country=>{const section=document.createElement('section');section.className='country';section.innerHTML=`<div class="country-name"><div class="country-location"><span>${country.flag}</span><span>${country.name}</span></div></div><div class="slider-wrap"><button class="slider-button left" type="button">‹</button><div class="slider"></div><button class="slider-button right" type="button">›</button></div>`;const slider=section.querySelector('.slider');for(let i=0;i<50;i++){const item=document.createElement('div');item.className='item';item.innerHTML='<div class="thumbnail"></div><div class="video-title">TRENDING VIDEO</div><div class="score"><div class="score-item">🎮 GAMING</div><div class="score-item">👤 —</div><div class="score-item">👁 — views</div><div class="score-item">📈 —/h</div><div class="score-item">👍 — likes</div><div class="score-item">💬 — comments</div></div>';slider.appendChild(item)}section.querySelector('.left').onclick=()=>slider.scrollBy({left:-slider.clientWidth*.8,behavior:'smooth'});section.querySelector('.right').onclick=()=>slider.scrollBy({left:slider.clientWidth*.8,behavior:'smooth'});container.appendChild(section);country.slider=slider;country.items=[...slider.children]});
async function loadCountryVideos(country){try{const r=await fetch('/api/videos?regionCode='+encodeURIComponent(country.regionCode));if(!r.ok)throw new Error(r.status);const d=await r.json();(Array.isArray(d.videos)?d.videos:[]).slice(0,50).forEach((v,i)=>{const item=country.items[i];if(!item)return;const t=item.querySelector('.thumbnail');if(v.thumbnail){const img=document.createElement('img');img.src=v.thumbnail;img.alt=v.title||'';img.loading='lazy';t.appendChild(img)}item.querySelector('.video-title').textContent=v.title||'';item.querySelector('.score').innerHTML=`<div class="score-item">🎮 GAMING</div><div class="score-item">👤 ${v.channel_title||'—'}</div><div class="score-item">👁 ${formatNumber(v.views)} views</div><div class="score-item">📈 —/h</div><div class="score-item">👍 ${formatNumber(v.likes)} likes</div><div class="score-item">💬 ${formatNumber(v.comments)} comments</div>`;item.onclick=()=>openPlayer(v.video_id)})}catch(e){console.error('Failed to load '+country.regionCode,e)}}
let twitchSwitchBusy=false,twitchPlayer=null,currentTwitchLogin='',twitchPlaying=false,twitchPlayAfterReady=false;
const shownTwitchStreamIds=new Set();
let twitchStreams=[];
function setTwitchStreamInfo(stream){const info=document.getElementById('twitchStreamInfo');const title=document.getElementById('twitchStreamTitle');const viewers=document.getElementById('twitchStreamViewers');if(!info||!title||!viewers)return;if(!stream){title.textContent='';viewers.textContent='';info.hidden=true;return}title.textContent=stream.title||'—';viewers.textContent='👁 '+formatNumber(stream.viewer_count)+' 視聴者';info.hidden=false}
function setTwitchPlayPauseState(playing){
twitchPlaying=playing;
const button=document.getElementById('twitchPlayPauseButton');
const icon=document.getElementById('twitchPlayPauseIcon');
if(button){button.querySelector('span').textContent=playing?'Pause':'Play';button.setAttribute('aria-label',playing?'Pause':'Play')}
if(icon){icon.innerHTML=playing?'<path d="M8 5v14"></path><path d="M16 5v14"></path>':'<path d="M8 5v14l11-7z"></path>'}
}
function createTwitchPlayer(login,shouldAutoplay=false){const area=document.getElementById('twitchPlayerArea');area.innerHTML='';const videoFrame=document.createElement('div');videoFrame.className='twitch-video-frame';area.appendChild(videoFrame);const chatFrame=document.createElement('iframe');chatFrame.className='twitch-chat-frame';chatFrame.title='Twitch chat';chatFrame.src='https://www.twitch.tv/embed/'+encodeURIComponent(login)+'/chat?parent='+encodeURIComponent(location.hostname)+'&darkpopout';chatFrame.allow='autoplay; fullscreen';area.appendChild(chatFrame);if(typeof Twitch==='undefined'||!Twitch.Player){throw new Error('Twitch Player API is unavailable')}twitchPlayAfterReady=shouldAutoplay;twitchPlayer=new Twitch.Player(videoFrame,{channel:login,width:'100%',height:'100%',autoplay:false,muted:false,parent:[location.hostname]});setTwitchPlayPauseState(false);twitchPlayer.addEventListener(Twitch.Player.READY,()=>{if(twitchPlayAfterReady){try{twitchPlayer.play()}catch(e){console.error('Twitch play after user action failed:',e)}}else{setTwitchPlayPauseState(false)}});twitchPlayer.addEventListener(Twitch.Player.PLAY,()=>{twitchPlayAfterReady=false;setTwitchPlayPauseState(true)});twitchPlayer.addEventListener(Twitch.Player.PLAYING,()=>{twitchPlayAfterReady=false;setTwitchPlayPauseState(true)});twitchPlayer.addEventListener(Twitch.Player.PAUSE,()=>setTwitchPlayPauseState(false));twitchPlayer.addEventListener(Twitch.Player.PLAYBACK_BLOCKED,()=>{twitchPlayAfterReady=false;setTwitchPlayPauseState(false)})}
async function fetchTwitchTop100(){const r=await fetch('/api/twitch');if(!r.ok)throw new Error(r.status);const d=await r.json();return Array.isArray(d.streams)?d.streams.slice(0,100):[]}
function selectNextTwitchStream(){const candidates=twitchStreams.filter(stream=>stream&&stream.id&&!shownTwitchStreamIds.has(stream.id));if(!candidates.length)return null;return candidates[Math.floor(Math.random()*candidates.length)]}
async function loadTwitchLive(shouldAutoplay=false){const area=document.getElementById('twitchPlayerArea');try{twitchStreams=await fetchTwitchTop100();const stream=selectNextTwitchStream();if(!stream){currentTwitchLogin='';twitchPlayer=null;twitchPlayAfterReady=false;setTwitchStreamInfo(null);setTwitchPlayPauseState(false);area.innerHTML='<div class="twitch-error">表示できる新しいTwitch LIVEがありません。</div>';return}shownTwitchStreamIds.add(stream.id);const login=stream.user_login;if(!login)throw new Error('Missing Twitch login');currentTwitchLogin=login;setTwitchStreamInfo(stream);createTwitchPlayer(login,shouldAutoplay)}catch(e){console.error(e);twitchPlayer=null;twitchPlayAfterReady=false;setTwitchStreamInfo(null);setTwitchPlayPauseState(false);area.innerHTML='<div class="twitch-error">Twitch LIVEの読み込みに失敗しました。</div>'}}
async function refreshTwitchTop100(){try{const latestStreams=await fetchTwitchTop100();twitchStreams=latestStreams;if(currentTwitchLogin){const current=latestStreams.find(stream=>stream.user_login===currentTwitchLogin);if(!current){await loadTwitchLive(true)}else{setTwitchStreamInfo(current)}}}catch(e){console.error('Failed to refresh Twitch TOP 100:',e)}}
async function switchTwitchLive(){if(twitchSwitchBusy)return;twitchSwitchBusy=true;const nextButton=document.getElementById('twitchNextButton');if(nextButton)nextButton.disabled=true;const area=document.getElementById('twitchPlayerArea');area.innerHTML='<div class="twitch-loading">次のTwitch LIVEを読み込み中…</div>';twitchPlayer=null;twitchPlayAfterReady=true;setTwitchStreamInfo(null);setTwitchPlayPauseState(false);try{await loadTwitchLive(true)}finally{twitchSwitchBusy=false;if(nextButton)nextButton.disabled=false}}
document.getElementById('twitchNextButton').onclick=switchTwitchLive;
document.getElementById('twitchPlayPauseButton').onclick=()=>{if(!twitchPlayer)return;try{if(twitchPlaying){twitchPlayer.pause()}else{twitchPlayer.play()}}catch(e){console.error('Twitch play/pause failed:',e)}};
document.getElementById('twitchWatchLiveButton').onclick=()=>{if(!twitchPlayer){loadTwitchLive(true);return}twitchPlayAfterReady=true;try{twitchPlayer.play()}catch(e){console.error('Twitch Watch Live play failed:',e)}};
function rankMark(i){return i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'️⃣'}
async function loadTwitchGames(){const track=document.getElementById('twitchRankingTrack');try{const r=await fetch('/api/twitch-games');if(!r.ok)throw new Error(r.status);const d=await r.json();const games=Array.isArray(d.games)?d.games.slice(0,5):[];if(!games.length){track.innerHTML='<div class="twitch-ranking-page"><div class="twitch-game-name">ゲームデータがありません</div></div>';return}track.innerHTML='';games.forEach((g,i)=>{const page=document.createElement('div');page.className='twitch-ranking-page';const image=g.box_art_url?g.box_art_url.replace('{width}','300').replace('{height}','400'):'';page.innerHTML=`<div class="twitch-game-rank">${rankMark(i)} ${i+1}位</div><div class="twitch-game-name"></div>${image?`<img class="twitch-game-image" src="${image}" alt="">`:''}<div class="twitch-streamer"><div class="twitch-streamer-name">🎮 ${g.name||'—'}</div><div class="twitch-streamer-meta">Twitch人気ゲームランキング</div></div>`;page.querySelector('.twitch-game-name').textContent=g.name||'—';track.appendChild(page)})}catch(e){console.error('Failed to load Twitch games:',e);track.innerHTML='<div class="twitch-ranking-page"><div class="twitch-game-name">Twitchゲームランキングの読み込みに失敗しました。</div></div>'}}
const playerOverlay=document.getElementById('playerOverlay'),youtubePlayer=document.getElementById('youtubePlayer');function openPlayer(id){if(!id)return;youtubePlayer.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1';playerOverlay.classList.add('active');document.body.style.overflow='hidden'}function closePlayerOverlay(){youtubePlayer.src='';playerOverlay.classList.remove('active');document.body.style.overflow=''}document.getElementById('closePlayer').onclick=closePlayerOverlay;playerOverlay.onclick=e=>{if(e.target===playerOverlay)closePlayerOverlay()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayerOverlay()});
shuffledCountries.forEach(loadCountryVideos);loadTwitchLive(false);loadTwitchGames();setInterval(refreshTwitchTop100,30000);
</script>
</body>
</html>
