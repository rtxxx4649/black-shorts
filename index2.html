<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TREND HUB</title><style>*{box-sizing:border-box}body{margin:0;background:#1B102B;color:#fff;font-family:Arial,sans-serif}.header{padding:0 20px 500px;background:linear-gradient(90deg,#0004,#0001,#0004),url('./e2e1003b-f8c4-4441-924c-df430cc634a5.png') center/cover;text-align:left}.site-title{font-size:clamp(22.5px,2.5vw,30px);font-weight:700;text-align:left}.e{color:red}.site-subtitle{color:#aaa;font-size:clamp(9px,1vw,11px);margin-top:8px;text-align:left}.twitch-section{background:#000;padding:0 0 30px}.twitch-heading{text-align:center;font-size:30px;font-weight:700;margin-bottom:18px}.twitch-player{width:100%;max-width:none;margin:0;background:#111;border:1px solid #333;display:grid;grid-template-columns:2fr 1fr;aspect-ratio:16/9}.twitch-video-frame,.twitch-chat-frame{width:100%;height:100%;border:0;background:#111}.twitch-loading,.twitch-error{height:100%;min-height:240px;display:flex;align-items:center;justify-content:center;color:#bbb;text-align:center;padding:20px}.twitch-switch-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px auto;width:min(100%,1000px)}.twitch-switch-controls button:last-child{grid-column:1 / -1}button{border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:17px;font-weight:700;min-width:145px;height:46px;cursor:pointer}button:disabled{opacity:.5}.twitch-top-games-heading{text-align:center;font-size:20px;font-weight:700;margin-top:24px}.twitch-ranking-wrap{overflow-x:auto;margin-top:12px}.twitch-ranking-track{display:flex;gap:16px;width:max-content}.twitch-ranking-page{width:min(360px,calc(100vw - 24px));background:#161616;border:1px solid #333;padding:16px}.twitch-game-image{width:100%;aspect-ratio:3/4;object-fit:cover}.twitch-game-name{text-align:center;font-size:22px;font-weight:700;margin:10px}.country-name{background:#000;text-align:center;padding:18px}.country-location{font-size:30px;font-weight:600}.slider{display:flex;gap:24px;overflow-x:auto;padding:0 20px}.item{flex:0 0 300px;background:#000;padding:10px}.thumbnail{aspect-ratio:16/9;background:#111}.thumbnail img{width:100%;height:100%;object-fit:cover}.video-title{margin-top:10px;height:63px;overflow:hidden}.score{display:grid;grid-template-columns:1fr 1fr;font-size:14px;margin-top:10px}.player-overlay{position:fixed;inset:0;background:#000f;display:none;align-items:center;justify-content:center;z-index:99}.player-overlay.active{display:flex}.player-container{width:min(1000px,94vw);aspect-ratio:16/9}.player-container iframe{width:100%;height:100%;border:0}@media(max-width:700px){.header{padding-bottom:100px}.twitch-player{display:grid;grid-template-columns:1fr;overflow:hidden;aspect-ratio:16/9;width:100%;}.twitch-video-frame{width:100%;height:100%;}.twitch-chat-frame{display:none}.item{flex-basis:270px}.country-location{font-size:25px}}@media(max-width:700px) and (orientation:landscape){.twitch-player{aspect-ratio:16/9;width:100%;}.twitch-video-frame{width:100%;height:100%;}}@media(min-width:701px){.header{padding-bottom:500px}.site-title{font-size:clamp(90px,10vw,120px)}.site-subtitle{font-size:clamp(36px,4vw,44px)}.twitch-player{width:100%;aspect-ratio:16/9}.twitch-switch-controls button:last-child{transform:translateY(10px)}} </style></head><body><header class="header"><div class="site-title">TR<span class="e">E</span>ND HUB</div><div class="site-subtitle">DISCOVER WHAT'S TRENDING</div></header><section class="twitch-section" id="twitch"><div class="twitch-player" id="twitchPlayerArea"><div class="twitch-loading">Twitch LIVEを読み込み中…</div></div><div class="twitch-switch-controls"><button id="twitchPlayPauseButton">Play</button><button id="twitchNextButton">Next Stream</button><button id="twitchWatchLiveButton">Watch Live</button></div><div class="twitch-top-games-heading">TOP 5 GAMES</div><div class="twitch-ranking-wrap"><div class="twitch-ranking-track" id="twitchRankingTrack"></div></div></section><main id="countries"></main><div id="playerOverlay" class="player-overlay"><div class="player-container"><iframe id="youtubePlayer" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div></div><script src="https://player.twitch.tv/js/embed/v1.js"></script><script>
const countries=[['🇺🇸','UNITED STATES','US'],['🇬🇧','UNITED KINGDOM','GB'],['🇦🇺','AUSTRALIA','AU'],['🇨🇦','CANADA','CA'],['🇩🇪','GERMANY','DE'],['🇵🇭','PHILIPPINES','PH'],['🇪🇸','SPAIN','ES'],['🇫🇷','FRANCE','FR'],['🇰🇷','SOUTH KOREA','KR'],['🇮🇹','ITALY','IT'],['🇻🇳','VIETNAM','VN'],['🇹🇷','TURKEY','TR'],['🇮🇳','INDIA','IN'],['🇧🇷','BRAZIL','BR'],['🇮🇩','INDONESIA','ID'],['🇯🇵','JAPAN','JP'],['🇲🇽','MEXICO','MX'],['🇹🇭','THAILAND','TH']].map(x=>({flag:x[0],name:x[1],regionCode:x[2]}));
const main=document.getElementById('countries');countries.sort(()=>Math.random()-.5).forEach(c=>{const s=document.createElement('section');s.innerHTML=`<div class="country-name"><div class="country-location">${c.flag} ${c.name}</div></div><div class="slider"></div>`;const sl=s.querySelector('.slider');for(let i=0;i<50;i++){const it=document.createElement('div');it.className='item';it.innerHTML='<div class="thumbnail"></div><div class="video-title">TRENDING VIDEO</div><div class="score"><div>🎮 GAMING</div><div>👤 —</div><div>👁 — views</div><div>👍 — likes</div></div>';sl.appendChild(it)}main.appendChild(s);c.items=[...sl.children]});
async function loadVideos(c){try{const r=await fetch('/api/videos?regionCode='+c.regionCode);if(!r.ok)throw Error(r.status);const d=await r.json();(d.videos||[]).slice(0,50).forEach((v,i)=>{const it=c.items[i];if(!it)return;if(v.thumbnail){const im=document.createElement('img');im.src=v.thumbnail;it.querySelector('.thumbnail').appendChild(im)}it.querySelector('.video-title').textContent=v.title||'';it.querySelector('.score').innerHTML=`<div>🎮 GAMING</div><div>👤 ${v.channel_title||'—'}</div><div>👁 ${Number(v.views||0).toLocaleString()} views</div><div>👍 ${Number(v.likes||0).toLocaleString()} likes</div>`;it.onclick=()=>{document.getElementById('youtubePlayer').src='https://www.youtube.com/embed/'+encodeURIComponent(v.video_id)+'?autoplay=1';document.getElementById('playerOverlay').classList.add('active')}})}catch(e){console.error(e)}}
let player=null,playing=false,login='',busy=false;const seenTwitchStreamers=new Set();const playPause=document.getElementById('twitchPlayPauseButton');function setState(v){playing=v;playPause.textContent=v?'Pause':'Play'}function createPlayer(name,autoplay){const a=document.getElementById('twitchPlayerArea');a.innerHTML='';const v=document.createElement('div');v.className='twitch-video-frame';a.appendChild(v);const chat=document.createElement('iframe');chat.className='twitch-chat-frame';chat.src='https://www.twitch.tv/embed/'+encodeURIComponent(name)+'/chat?parent='+encodeURIComponent(location.hostname)+'&darkpopout';chat.allow='autoplay;fullscreen';a.appendChild(chat);if(!window.Twitch||!Twitch.Player)throw Error('Twitch Player API unavailable');player=new Twitch.Player(v,{channel:name,width:'100%',height:'100%',autoplay:!!autoplay,muted:false,parent:[location.hostname]});setState(false);player.addEventListener(Twitch.Player.PLAY,()=>setState(true));player.addEventListener(Twitch.Player.PLAYING,()=>setState(true));player.addEventListener(Twitch.Player.PAUSE,()=>setState(false));player.addEventListener(Twitch.Player.PLAYBACK_BLOCKED,()=>setState(false));if(autoplay)player.addEventListener(Twitch.Player.READY,()=>{try{player.play()}catch(e){console.warn(e)}})}async function loadTwitch(autoplay=false){try{const seen=[...seenTwitchStreamers].join(',');const url=seen?'/api/twitch?seen='+encodeURIComponent(seen):'/api/twitch';const r=await fetch(url);if(!r.ok)throw Error(r.status);const d=await r.json();const streams=Array.isArray(d.streams)?d.streams:[];if(!streams.length){document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-error">現在表示できる未視聴のTwitch LIVEがありません。</div>';player=null;setState(false);return}const selected=streams[Math.floor(Math.random()*streams.length)];login=selected.user_login;seenTwitchStreamers.add(login.toLowerCase());createPlayer(login,autoplay)}catch(e){console.error(e);document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-error">Twitch LIVEの読み込みに失敗しました。</div>';player=null;setState(false)}}function playCurrent(){if(!player)return;try{player.play();setState(true)}catch(e){console.error(e)}}playPause.onclick=()=>{if(!player)return;try{playing?player.pause():player.play()}catch(e){console.error(e)}};document.getElementById('twitchWatchLiveButton').onclick=()=>{if(login)window.open('https://www.twitch.tv/'+encodeURIComponent(login),'_blank','noopener,noreferrer')};document.getElementById('twitchNextButton').onclick=async()=>{if(busy)return;busy=true;const b=document.getElementById('twitchNextButton');b.disabled=true;document.getElementById('twitchPlayerArea').innerHTML='<div class="twitch-loading">次のTwitch LIVEを読み込み中…</div>';try{await loadTwitch(true)}finally{busy=false;b.disabled=false}};
async function loadGames(){try{const r=await fetch('/api/twitch-games');const d=await r.json();const t=document.getElementById('twitchRankingTrack');(d.games||[]).slice(0,5).forEach((g,i)=>{const p=document.createElement('div');p.className='twitch-ranking-page';const im=g.box_art_url?.replace('{width}','300').replace('{height}','400');p.innerHTML=`<div>${i+1}位</div><div class="twitch-game-name">${g.name||'—'}</div>${im?`<img class="twitch-game-image" src="${im}">`:''}`;t.appendChild(p)})}catch(e){console.error(e)}}countries.forEach(loadVideos);loadTwitch(false);loadGames();
</script></body></html>
