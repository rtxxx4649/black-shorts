<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREND HUB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--site-scale:1}
html,body{width:100%;min-height:100%;background:#1B102B}
body{padding:0;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden}
.header{position:relative;padding:calc(110px * var(--site-scale)) calc(20px * var(--site-scale)) calc(180px * var(--site-scale));margin-bottom:0;overflow:hidden;background-image:linear-gradient(90deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.08) 55%,rgba(0,0,0,.20) 100%),url("./e2e1003b-f8c4-4441-924c-df430cc634a5.png");background-size:cover;background-position:center;background-repeat:no-repeat}
.site-title{font-size:calc(48px * var(--site-scale));font-weight:700;line-height:1;white-space:nowrap}.site-title .trend{color:#fff}.site-title .world{color:#ff0000}.site-title .e{color:#ff0000}.site-title .hub{color:#fff}.site-subtitle{color:#aaa;font-size:calc(18px * var(--site-scale));margin-top:calc(8px * var(--site-scale));white-space:nowrap}
.trending-title{width:100%;padding:0 0 calc(8px * var(--site-scale));text-align:center;overflow:hidden;background:#1B102B}.trending-title-text{width:100%;box-sizing:border-box;color:#A855F7;background:#000;padding:calc(18px * var(--site-scale)) calc(12px * var(--site-scale));font-size:calc(42px * var(--site-scale));font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-align:center}
.country{margin-bottom:calc(55px * var(--site-scale))}.country-name{width:100%;margin:0 0 calc(18px * var(--site-scale));padding:calc(18px * var(--site-scale)) calc(12px * var(--site-scale));color:#fff;background:#000;text-align:center;overflow:hidden}.country-header{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center}.country-location{display:flex;align-items:center;justify-content:center;gap:calc(8px * var(--site-scale));width:100%;font-size:calc(30px * var(--site-scale));font-weight:600;line-height:1.2;white-space:nowrap;overflow:visible;text-align:center}.flag{flex:0 0 auto;font-size:1em;line-height:1}.country-location-name{flex:0 1 auto;white-space:nowrap}
.slider-wrap{position:relative;width:100%}.slider{display:flex;gap:calc(24px * var(--site-scale));width:100%;overflow-x:auto;overflow-y:hidden;padding:0 calc(20px * var(--site-scale));scrollbar-width:none;-webkit-overflow-scrolling:touch}.slider::-webkit-scrollbar{display:none}.slider-button{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:calc(54px * var(--site-scale));height:calc(54px * var(--site-scale));border:0;border-radius:50%;background:#000;color:#fff;font-size:calc(36px * var(--site-scale));font-weight:700;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}.slider-button:hover{background:#222}.slider-button.left{left:calc(10px * var(--site-scale))}.slider-button.right{right:calc(10px * var(--site-scale))}
.item{flex:0 0 calc(300px * var(--site-scale));width:calc(300px * var(--site-scale));cursor:pointer;background:#000;padding:calc(10px * var(--site-scale))}.thumbnail{position:relative;width:100%;aspect-ratio:16/9;background:#111;overflow:hidden;border-radius:calc(2px * var(--site-scale))}.thumbnail img{width:100%;height:100%;display:block;object-fit:cover}.video-title{width:100%;margin-top:calc(12px * var(--site-scale));color:#fff;font-size:calc(15px * var(--site-scale));font-weight:500;line-height:1.4;height:calc(63px * var(--site-scale));display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;word-break:break-word}.video-category{display:none}.score{width:100%;margin-top:calc(10px * var(--site-scale));color:#fff;font-size:calc(13px * var(--site-scale));line-height:1.6;font-weight:500;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(3,auto);column-gap:calc(12px * var(--site-scale));row-gap:calc(2px * var(--site-scale));align-items:center}.score-item{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score-item:nth-child(1){grid-column:1;grid-row:1}.score-item:nth-child(2){grid-column:2;grid-row:1}.score-item:nth-child(3){grid-column:1;grid-row:2}.score-item:nth-child(4){grid-column:2;grid-row:2}.score-item:nth-child(5){grid-column:1;grid-row:3}.score-item:nth-child(6){grid-column:2;grid-row:3}
.player-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.95)}.player-overlay.active{display:flex}.player-container{position:relative;width:min(1000px,94vw);aspect-ratio:16/9;background:#000}.player-container iframe{width:100%;height:100%;border:0;display:block}.close-player{position:absolute;top:-45px;right:0;width:36px;height:36px;border:0;border-radius:50%;background:#fff;color:#000;font-size:22px;line-height:36px;cursor:pointer}
@media(min-width:601px){.slider-button{display:flex}}@media(max-width:600px){.header{padding:calc(90px * var(--site-scale)) calc(20px * var(--site-scale)) calc(160px * var(--site-scale));background-position:center}.site-title{font-size:calc(36px * var(--site-scale))}.site-subtitle{font-size:calc(15px * var(--site-scale))}.trending-title{padding-bottom:calc(6px * var(--site-scale))}.trending-title-text{padding:calc(16px * var(--site-scale)) calc(8px * var(--site-scale))}.country{margin-bottom:calc(45px * var(--site-scale))}.country-name{padding:calc(16px * var(--site-scale)) calc(10px * var(--site-scale))}.country-location{gap:calc(7px * var(--site-scale));font-size:calc(25px * var(--site-scale))}.item{flex-basis:calc(270px * var(--site-scale));width:calc(270px * var(--site-scale))}.video-title{font-size:calc(14px * var(--site-scale));height:calc(58.8px * var(--site-scale))}.score{column-gap:calc(8px * var(--site-scale));font-size:calc(12px * var(--site-scale))}}
</style>
</head>
<body>
<header class="header"><div class="site-title"><span class="trend">TR</span><span class="e">E</span><span class="trend">ND</span><span class="hub">HUB</span></div><div class="site-subtitle">DISCOVER WHAT'S TRENDING</div></header>
<div class="trending-title"><div class="trending-title-text">👑 TRENDING VIDEOS 🔥</div></div><main id="countries"></main>
<div id="playerOverlay" class="player-overlay"><div class="player-container"><button id="closePlayer" class="close-player" type="button" aria-label="Close">×</button><iframe id="youtubePlayer" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>
<script>
function updateSiteScale(){const viewportWidth=window.innerWidth;const scale=Math.min(1,Math.max(.6,viewportWidth/1200));document.documentElement.style.setProperty("--site-scale",scale)}updateSiteScale();window.addEventListener("resize",updateSiteScale);
const countries=[{flag:"🇺🇸",name:"UNITED STATES",regionCode:"US"},{flag:"🇬🇧",name:"UNITED KINGDOM",regionCode:"GB"},{flag:"🇦🇺",name:"AUSTRALIA",regionCode:"AU"},{flag:"🇨🇦",name:"CANADA",regionCode:"CA"},{flag:"🇩🇪",name:"GERMANY",regionCode:"DE"},{flag:"🇵🇭",name:"PHILIPPINES",regionCode:"PH"},{flag:"🇪🇸",name:"SPAIN",regionCode:"ES"},{flag:"🇫🇷",name:"FRANCE",regionCode:"FR"},{flag:"🇰🇷",name:"SOUTH KOREA",regionCode:"KR"},{flag:"🇮🇹",name:"ITALY",regionCode:"IT"},{flag:"🇻🇳",name:"VIETNAM",regionCode:"VN"},{flag:"🇹🇷",name:"TURKEY",regionCode:"TR"},{flag:"🇮🇳",name:"INDIA",regionCode:"IN"},{flag:"🇧🇷",name:"BRAZIL",regionCode:"BR"},{flag:"🇮🇩",name:"INDONESIA",regionCode:"ID"},{flag:"🇯🇵",name:"JAPAN",regionCode:"JP"},{flag:"🇲🇽",name:"MEXICO",regionCode:"MX"},{flag:"🇹🇭",name:"THAILAND",regionCode:"TH"}];const TOTAL_SLOTS=50;const MAX_VIDEOS=50;
function formatNumber(value){const number=Number(value);if(!Number.isFinite(number))return "—";return number.toLocaleString()}function fitTextToOneLine(element,maximumFontSize,minimumFontSize){if(!element)return;const parent=element.parentElement;if(!parent)return;const scale=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--site-scale"))||1;const scaledMaximum=maximumFontSize*scale;const scaledMinimum=minimumFontSize*scale;element.style.fontSize=`${scaledMaximum}px`;const availableWidth=element.clientWidth;if(availableWidth<=0)return;let currentFontSize=scaledMaximum;while(element.scrollWidth>availableWidth&&currentFontSize>scaledMinimum){currentFontSize-=.5*scale;element.style.fontSize=`${currentFontSize}px`}}
function fitTrendingTitle(){const element=document.querySelector(".trending-title-text");if(!element)return;fitTextToOneLine(element,42,16)}function fitCountryHeader(countryElement){if(!countryElement)return;fitTextToOneLine(countryElement.querySelector(".country-location"),30,12)}function fitAllHeaders(){fitTrendingTitle();document.querySelectorAll(".country").forEach(section=>fitCountryHeader(section))}
const container=document.getElementById("countries");const shuffledCountries=[...countries];for(let i=shuffledCountries.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffledCountries[i],shuffledCountries[j]]=[shuffledCountries[j],shuffledCountries[i]]}
shuffledCountries.forEach(country=>{const section=document.createElement("section");section.className="country";const title=document.createElement("div");title.className="country-name";title.innerHTML=`<div class="country-header"><div class="country-location"><span class="flag">${country.flag}</span><span class="country-location-name">${country.name}</span></div></div>`;const sliderWrap=document.createElement("div");sliderWrap.className="slider-wrap";const leftButton=document.createElement("button");leftButton.className="slider-button left";leftButton.type="button";leftButton.setAttribute("aria-label",`Scroll ${country.name} left`);leftButton.textContent="‹";const rightButton=document.createElement("button");rightButton.className="slider-button right";rightButton.type="button";rightButton.setAttribute("aria-label",`Scroll ${country.name} right`);rightButton.textContent="›";const slider=document.createElement("div");slider.className="slider";for(let i=0;i<TOTAL_SLOTS;i++){const item=document.createElement("div");item.className="item empty";item.innerHTML=`<div class="thumbnail"></div><div class="video-title">TRENDING VIDEO</div><div class="video-category">🎮 GAMING</div><div class="score"><div class="score-item">🎮 GAMING</div><div class="score-item">👤 —</div><div class="score-item">👁 — views</div><div class="score-item">📈 —/h</div><div class="score-item">👍 — likes</div><div class="score-item">💬 — comments</div></div>`;slider.appendChild(item)}sliderWrap.appendChild(leftButton);sliderWrap.appendChild(slider);sliderWrap.appendChild(rightButton);leftButton.addEventListener("click",()=>slider.scrollBy({left:-slider.clientWidth*.8,behavior:"smooth"}));rightButton.addEventListener("click",()=>slider.scrollBy({left:slider.clientWidth*.8,behavior:"smooth"}));section.appendChild(title);section.appendChild(sliderWrap);container.appendChild(section);country.element=section;country.slider=slider;country.items=[...slider.querySelectorAll(".item")]});
fitAllHeaders();const resizeObserver=new ResizeObserver(()=>{updateSiteScale();fitAllHeaders()});resizeObserver.observe(document.documentElement);window.addEventListener("resize",fitAllHeaders);
async function loadCountryVideos(country){try{const response=await fetch(`/api/videos?regionCode=${encodeURIComponent(country.regionCode)}`);if(!response.ok)throw new Error(`API error: ${response.status}`);const data=await response.json();const videos=Array.isArray(data.videos)?data.videos:[];insertVideos(country,videos.slice(0,MAX_VIDEOS))}catch(error){console.error(`Failed to load ${country.regionCode}:`,error)}}function insertVideos(country,videos){videos.forEach((video,videoIndex)=>{const item=country.items[videoIndex];if(!item)return;const thumbnail=item.querySelector(".thumbnail");const title=item.querySelector(".video-title");if(video.thumbnail){const image=document.createElement("img");image.src=video.thumbnail;image.alt=video.title||"";image.loading="lazy";thumbnail.appendChild(image)}title.textContent=video.title||"";const likes=video.likes==null?"—":formatNumber(video.likes);const views=video.views==null?"—":formatNumber(video.views);const comments=video.comments==null?"—":formatNumber(video.comments);item.querySelector(".score").innerHTML=`<div class="score-item">🎮 GAMING</div><div class="score-item">👤 ${video.channel_title||"—"}</div><div class="score-item">👁 ${views} views</div><div class="score-item">📈 —/h</div><div class="score-item">👍 ${likes} likes</div><div class="score-item">💬 ${comments} comments</div>`;item.classList.remove("empty");item.onclick=()=>openPlayer(video.video_id)})}
const playerOverlay=document.getElementById("playerOverlay");const youtubePlayer=document.getElementById("youtubePlayer");const closePlayer=document.getElementById("closePlayer");function openPlayer(videoId){if(!videoId)return;youtubePlayer.src=`https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1`;playerOverlay.classList.add("active");document.body.style.overflow="hidden"}function closePlayerOverlay(){youtubePlayer.src="";playerOverlay.classList.remove("active");document.body.style.overflow=""}closePlayer.addEventListener("click",closePlayerOverlay);playerOverlay.addEventListener("click",event=>{if(event.target===playerOverlay)closePlayerOverlay()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closePlayerOverlay()});shuffledCountries.forEach(country=>loadCountryVideos(country));setTimeout(fitAllHeaders,500);setTimeout(fitAllHeaders,1500);
</script></body></html>
