<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TREND WORLD</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      padding: 40px 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .site-title {
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .site-title .trend {
      color: #fff;
    }

    .site-title .world {
      color: #ff0000;
    }

    .site-subtitle {
      color: #aaa;
      font-size: 18px;
      margin-top: 8px;
      white-space: nowrap;
    }

    /* =========================
       ADVERTISEMENT
       ========================= */

    .ad-space {
      width: calc(100% - 40px);
      height: 120px;
      margin: 0 20px 60px;
      background: #111;
    }

    /* =========================
       COUNTRY
       ========================= */

    .country {
      margin-bottom: 55px;
    }

    .country-name {
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      padding: 0 20px;
      margin-bottom: 18px;
    }

    /* =========================
       SLIDER
       ========================= */

    .slider {
      display: flex;
      gap: 24px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 20px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    /* =========================
       VIDEO CARD
       ========================= */

    .item {
      flex: 0 0 300px;
      width: 300px;
      cursor: pointer;
    }

    /* =========================
       THUMBNAIL
       ========================= */

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      border-radius: 2px;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* =========================
       VIDEO TITLE
       ========================= */

    .video-title {
      width: 100%;
      margin-top: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      height: 63px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      word-break: break-word;
    }

    /* =========================
       CATEGORY
       ========================= */

    .video-category {
      width: 100%;
      margin-top: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* =========================
       SCORE
       ========================= */

    .score {
      width: 100%;
      margin-top: 0;
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
      font-weight: 500;
    }

    /* =========================
       YOUTUBE PLAYER
       ========================= */

    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.95);
    }

    .player-overlay.active {
      display: flex;
    }

    .player-container {
      position: relative;
      width: min(1000px, 94vw);
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .close-player {
      position: absolute;
      top: -45px;
      right: 0;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 22px;
      line-height: 36px;
      cursor: pointer;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding-top: 25px;
      }

      .site-title {
        font-size: 36px;
      }

      .site-subtitle {
        font-size: 15px;
      }

      .country {
        margin-bottom: 45px;
      }

      .country-name {
        font-size: 24px;
      }

      .item {
        flex-basis: 270px;
        width: 270px;
      }

      .video-title {
        font-size: 14px;
        height: 58.8px;
      }

    }

  </style>

</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header class="header">

    <div class="site-title">
      <span class="trend">TREND</span>
      <span class="world">WORLD</span>
    </div>

    <div class="site-subtitle">
      DISCOVER WHAT'S TRENDING
    </div>

  </header>

  <!-- =========================
       ADVERTISEMENT
       ========================= -->

  <div class="ad-space"></div>

  <!-- =========================
       COUNTRY SLIDERS
       ========================= -->

  <main id="countries"></main>

  <!-- =========================
       YOUTUBE PLAYER
       ========================= -->

  <div
    id="playerOverlay"
    class="player-overlay"
  >

    <div class="player-container">

      <button
        id="closePlayer"
        class="close-player"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

      <iframe
        id="youtubePlayer"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

    </div>

  </div>

  <script>

    /*
    ==========================================
       COUNTRIES
    ==========================================
    */

    const countries = [
      { flag: "🇺🇸", name: "UNITED STATES", regionCode: "US" },
      { flag: "🇬🇧", name: "UNITED KINGDOM", regionCode: "GB" },
      { flag: "🇦🇺", name: "AUSTRALIA", regionCode: "AU" },
      { flag: "🇨🇦", name: "CANADA", regionCode: "CA" },
      { flag: "🇩🇪", name: "GERMANY", regionCode: "DE" },
      { flag: "🇵🇭", name: "PHILIPPINES", regionCode: "PH" },
      { flag: "🇪🇸", name: "SPAIN", regionCode: "ES" },
      { flag: "🇫🇷", name: "FRANCE", regionCode: "FR" },
      { flag: "🇰🇷", name: "SOUTH KOREA", regionCode: "KR" },
      { flag: "🇮🇹", name: "ITALY", regionCode: "IT" },
      { flag: "🇻🇳", name: "VIETNAM", regionCode: "VN" },
      { flag: "🇹🇷", name: "TURKEY", regionCode: "TR" },
      { flag: "🇮🇳", name: "INDIA", regionCode: "IN" },
      { flag: "🇧🇷", name: "BRAZIL", regionCode: "BR" },
      { flag: "🇮🇩", name: "INDONESIA", regionCode: "ID" },
      { flag: "🇯🇵", name: "JAPAN", regionCode: "JP" },
      { flag: "🇲🇽", name: "MEXICO", regionCode: "MX" },
      { flag: "🇹🇭", name: "THAILAND", regionCode: "TH" }
    ];

    /*
    ==========================================
       SETTINGS
    ==========================================
    */

    const TOTAL_SLOTS = 50;
    const MAX_VIDEOS = 50;

    /*
    ==========================================
       SHUFFLE
    ==========================================
    */

    function shuffle(array) {

      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [result[i], result[j]] =
          [result[j], result[i]];

      }

      return result;

    }

    /*
    ==========================================
       CREATE COUNTRY UI
    ==========================================
    */

    const container =
      document.getElementById("countries");

    countries.forEach(country => {

      const section =
        document.createElement("section");

      section.className = "country";

      const title =
        document.createElement("div");

      title.className = "country-name";

      title.textContent =
        `${country.flag} ${country.name}`;

      const slider =
        document.createElement("div");

      slider.className = "slider";

      /*
      CREATE 50 FIXED SLOTS
      */

      for (let i = 0; i < TOTAL_SLOTS; i++) {

        const item =
          document.createElement("div");

        item.className = "item empty";

        item.innerHTML = `

          <div class="thumbnail"></div>

          <div class="video-title">
            TRENDING VIDEO
          </div>

          <div class="video-category">
            🎮 GAMING
          </div>

          <div class="score">
            🎮 GAMING<br>
            🔥 Trending<br>
            👤 —<br>
            👁 — views
          </div>

        `;

        slider.appendChild(item);

      }

      section.appendChild(title);
      section.appendChild(slider);
      container.appendChild(section);

      country.element = section;
      country.slider = slider;

      country.items =
        [...slider.querySelectorAll(".item")];

    });

    /*
    ==========================================
       LOAD COUNTRY VIDEOS
    ==========================================
    */

    async function loadCountryVideos(country) {

      try {

        const response =
          await fetch(
            `/api/youtube?regionCode=${encodeURIComponent(
              country.regionCode
            )}`
          );

        if (!response.ok) {

          throw new Error(
            `API error: ${response.status}`
          );

        }

        const data =
          await response.json();

        const videos =
          Array.isArray(data.gamingPopular)
            ? data.gamingPopular
            : [];

        /*
        MAXIMUM 50 VIDEOS
        */

        insertVideos(
          country,
          videos.slice(0, MAX_VIDEOS)
        );

      } catch (error) {

        console.error(
          `Failed to load ${country.regionCode}:`,
          error
        );

      }

    }

    /*
    ==========================================
       INSERT VIDEOS
    ==========================================
    */

    function insertVideos(country, videos) {

      /*
      RANDOMLY SELECT VIDEO POSITIONS
      FROM 50 FIXED SLOTS
      */

      const positions =
        shuffle(
          [...Array(TOTAL_SLOTS).keys()]
        ).slice(
          0,
          videos.length
        );

      videos.forEach((video, videoIndex) => {

        const slotIndex =
          positions[videoIndex];

        const item =
          country.items[slotIndex];

        if (!item) {
          return;
        }

        const thumbnail =
          item.querySelector(".thumbnail");

        const title =
          item.querySelector(".video-title");

        const category =
          item.querySelector(".video-category");

        const score =
          item.querySelector(".score");

        /*
        THUMBNAIL
        */

        if (video.thumbnail) {

          const image =
            document.createElement("img");

          image.src =
            video.thumbnail;

          image.alt =
            video.title || "";

          image.loading =
            "lazy";

          thumbnail.appendChild(image);

        }

        /*
        TITLE
        */

        title.textContent =
          video.title || "";

        /*
        CATEGORY
        */

        category.textContent =
          "";

        /*
        VIEWS
        */

        const views =
          Number(
            video.views || 0
          ).toLocaleString();

        /*
        SCORE
        */

        score.innerHTML = `
          🎮 GAMING<br>
          🔥 Trending<br>
          👤 ${video.channelTitle || "—"}<br>
          👁 ${views} views
        `;

        /*
        VIDEO ID
        */

        item.dataset.videoId =
          video.id;

        /*
        ACTIVE CARD
        */

        item.classList.remove("empty");

        /*
        CLICK TO PLAY
        */

        item.addEventListener(
          "click",
          () => {
            openPlayer(video.id);
          }
        );

      });

    }

    /*
    ==========================================
       YOUTUBE PLAYER
       ==========================================
    */

    const playerOverlay =
      document.getElementById(
        "playerOverlay"
      );

    const youtubePlayer =
      document.getElementById(
        "youtubePlayer"
      );

    const closePlayer =
      document.getElementById(
        "closePlayer"
      );

    function openPlayer(videoId) {

      if (!videoId) {
        return;
      }

      youtubePlayer.src =
        `https://www.youtube-nocookie.com/embed/${encodeURIComponent(
          videoId
        )}?rel=0`;

      playerOverlay.classList.add(
        "active"
      );

    }

    function closeVideoPlayer() {

      youtubePlayer.src = "";

      playerOverlay.classList.remove(
        "active"
      );

    }

    closePlayer.addEventListener(
      "click",
      closeVideoPlayer
    );

    playerOverlay.addEventListener(
      "click",
      event => {

        if (event.target === playerOverlay) {

          closeVideoPlayer();

        }

      }
    );

    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "Escape") {

          closeVideoPlayer();

        }

      }
    );

    /*
    ==========================================
       LOAD ALL COUNTRIES
    ==========================================
    */

    countries.forEach(country => {

      loadCountryVideos(country);

    });

  </script>

</body>

</html>
